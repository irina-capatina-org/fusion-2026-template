name: uipath-pdd

# Stage 1 of the ADLC chain:
#
#   Identify request document -> Generate PDD -> Open PR
#
# Three jobs, not five. Reading the request used to be its own job that handed
# WORK_DIR to Generate PDD as an artifact, and assigning the PR used to be its own
# job after Open PR. Both boundaries cost a runner spin-up and a second checkout -
# about 35 seconds - to move a few bytes between steps that could simply be
# adjacent.
#
# Maestro creates branch  analysis-<key>  from develop and pushes
# docs/<key>-request-details.docx into it (the key is the branch name minus the
# "analysis-" prefix, e.g. analysis-jactiv-557 -> jactiv-557). The docs folder can
# hold request details for several stories at once, so every job resolves the file
# by the branch's own key - never "whatever request-details file is lying around".
#
# The PR into develop is the Maestro resume signal: the case waits on
# PULL_CREATED_IN_REPO filtered by head.ref == analysis-* && base.ref == develop.
# Do NOT auto-merge - the merge of that PR is the separate "PDD approved" signal.

on:
  push:
    branches:
      - 'analysis**'
    # A trigger path cannot reference the branch, so it stays a broad glob and the
    # Identify job narrows it to <key>-request-details* for this branch.
    paths:
      - 'docs/*request-details*'
  # Manual re-run: pick the analysis branch in the UI, nothing to fill in.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCS_DIR: docs
  BASE_BRANCH: develop
  ASSIGNEE: irina-capatina-uipath
  AGENT_MODEL: claude-sonnet-4-6
  MIN_PDD_BYTES: '4000'
  # THE section contract, defined once. The analyst prompt renders this list, the
  # repair prompt renders it, the agent's self-check counts it, and
  # validate-pdd.sh reads it from the environment - so the prompt and the validator
  # can no longer disagree. They used to be four separate copies, and a run where
  # the workflow was uploaded but the validator was not produced a document with
  # the eleven sections the prompt asked for, ten "missing section" errors from a
  # validator still expecting thirteen, and a 143-second repair that put the two
  # deleted sections back. Change a section HERE and nowhere else.
  PDD_SECTIONS: |
    ## 1. Document Control
    ## 2. Introduction
    ## 3. Process Overview
    ## 4. To-Be Process (High Level)
    ## 5. Detailed Process Steps
    ## 6. Applications and Systems
    ## 7. Business Rules
    ## 8. Business Exceptions
    ## 9. System Errors
    ## 10. Assumptions, Dependencies and Open Questions
    ## 11. Success Criteria
  # Where the extracted request markdown lives inside the workspace. Never
  # committed - only the PDD is staged. Must NOT start with a dot:
  # actions/upload-artifact@v4 silently skips hidden files.
  WORK_DIR: request-work

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: pdd-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ═══════════════════════════════════════════════════════════════
  # 1. Identify request document
  # ═══════════════════════════════════════════════════════════════
  identify:
    name: Identify request document
    runs-on: ubuntu-latest
    outputs:
      branch:       ${{ steps.resolve.outputs.branch }}
      file_key:     ${{ steps.resolve.outputs.file_key }}
      story_key:    ${{ steps.resolve.outputs.story_key }}
      request_file: ${{ steps.resolve.outputs.request_file }}
      pdd_file:     ${{ steps.resolve.outputs.pdd_file }}
      legacy_pdd:   ${{ steps.resolve.outputs.legacy_pdd }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      # The card must light up before the agent starts thinking, not after.
      - name: Observe - Analysis in progress
        # A dashboard write must never fail the pipeline: observe.sh uses `set -e`, so
        # a rate limit or a transient 5xx would otherwise take a good stage down with it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          # The key is derived here rather than taken from the resolve step, so
          # the card lights up before any of the identification work runs.
          #   analysis-jactiv-611 -> jactiv-611 -> JACTIV-611
          EPIC="$(echo "${GITHUB_REF_NAME#*-}" | tr '[:lower:]' '[:upper:]')"

          bash .github/scripts/observe.sh set epicKey="$EPIC" repo="${{ github.repository }}"
          bash .github/scripts/observe.sh stage Analysis \
            status=in-progress task="Reading the request" run=${{ github.run_id }}

      - name: Resolve request document for this branch
        id: resolve
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF#refs/heads/}"

          # Same rule Maestro uses to name the file: everything after the first
          # dash. analysis-jactiv-557 -> jactiv-557
          FILE_KEY="${BRANCH#*-}"
          if [ -z "$FILE_KEY" ] || [ "$FILE_KEY" = "$BRANCH" ]; then
            echo "::error::Branch '$BRANCH' has no key after an 'analysis-' prefix."
            exit 1
          fi

          # Branches are lowercase; Jira keys are uppercase.
          STORY_KEY=$(echo "$FILE_KEY" | tr '[:lower:]' '[:upper:]')

          # Resolve strictly by this branch's key, so request details belonging to
          # another story or CR sitting in docs/ can never be picked up.
          #
          # CASE-INSENSITIVE on purpose. Branch names are lowercase (analysis-jactiv-611)
          # while the uploaded document carries the Jira key as typed, which is uppercase
          # (JACTIV-611-request-details.docx). The runner is Linux, so a literal glob on
          # the lowercase key matches nothing and this step fails with "no request
          # details found" while the file is sitting right there. `find -iname` removes
          # the whole class of problem; the key still has to match, only its case is free.
          MATCHES=$(find "$DOCS_DIR" -maxdepth 1 -type f \
                      -iname "$FILE_KEY-request-details*" 2>/dev/null | sort || true)
          COUNT=$(printf '%s' "$MATCHES" | grep -c . || true)
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::No $DOCS_DIR/$FILE_KEY-request-details* found on branch $BRANCH."
            echo "Files in $DOCS_DIR:"
            ls -1 "$DOCS_DIR" 2>/dev/null || echo "  (no $DOCS_DIR folder)"
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "::warning::$COUNT files match $FILE_KEY-request-details*; using the first."
            echo "$MATCHES"
          fi
          REQUEST_FILE=$(printf '%s\n' "$MATCHES" | head -1)

          # ── document naming: the REPOSITORY, never a stage story key ───────────
          # pdd-<repo>.md / sdd-<repo>.md / dsd-<repo>.md / architecture-<repo>.json.
          # The repo name is the only identifier stable across the whole lifecycle -
          # analysis, architecture, development and docs each run on their own Jira
          # story, so a key-named document means a change request writes a SECOND
          # document on a new key and leaves the reviewed one orphaned in docs/.
          # Same rule architectural-considerations.md §4 already applies to resource
          # names, for the same reason. The living documents are updated in place;
          # their history is git plus their own Document History table.
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          PDD_FILE="$DOCS_DIR/pdd-$REPO_NAME.md"

          # A PDD written under the old key-based convention is RENAMED onto the new
          # name rather than left behind, so a repo part-way through the migration
          # converges instead of ending up holding one of each.
          #
          # This job only REPORTS it: its checkout is discarded when the job ends, so
          # a rename here would never reach a commit. The Commit PDD job does the
          # actual `git mv` in the tree it pushes from.
          LEGACY_PDD=""
          if [ ! -f "$PDD_FILE" ]; then
            LEGACY_PDD=$(find "$DOCS_DIR" -maxdepth 1 -type f \
                           \( -iname 'pdd-*.md' -o -iname '*-pdd.md' \) \
                         ! -name "$(basename "$PDD_FILE")" | sort | head -1 || true)
            [ -n "$LEGACY_PDD" ] && echo "::notice::Legacy PDD '$LEGACY_PDD' will be renamed to '$PDD_FILE'."
          fi

          {
            echo "branch=$BRANCH"
            echo "file_key=$FILE_KEY"
            echo "story_key=$STORY_KEY"
            echo "request_file=$REQUEST_FILE"
            echo "pdd_file=$PDD_FILE"
            echo "legacy_pdd=${LEGACY_PDD:-}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 1. Request document identified"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Key | \`$FILE_KEY\` |"
            echo "| Story key | \`$STORY_KEY\` |"
            echo "| Request document | \`$REQUEST_FILE\` ($(wc -c < "$REQUEST_FILE" | tr -d ' ') bytes) |"
            echo "| PDD to write | \`$PDD_FILE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Branch:           $BRANCH"
          echo "Key:              $FILE_KEY"
          echo "Request document: $REQUEST_FILE"
          echo "PDD to write:     $PDD_FILE"

  # ═══════════════════════════════════════════════════════════════
  # 2. Read request
  # Maestro pushes the SME's document exactly as it came off the Jira epic - a
  # .docx - so convert it to markdown here. The result is passed to the next job
  # as an artifact and never committed.
  # ═══════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════
  # 3. Generate PDD
  # ═══════════════════════════════════════════════════════════════
  generate-pdd:
    name: Generate PDD
    needs: identify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identify.outputs.branch }}
          fetch-depth: 1

      # The request extraction used to be its own job that uploaded WORK_DIR as an
      # artifact for this one to download. The artifact existed only to cross a job
      # boundary, and the boundary cost a runner spin-up, a second checkout and the
      # upload/download pair - about 20 seconds for a step that takes a few.
      - name: Extract request text
        env:
          REQUEST_FILE: ${{ needs.identify.outputs.request_file }}
        run: |
          set -euo pipefail
          # media/ is created up front even when nothing extracts into it: the IMAGES
          # count further down pipes `find` under `pipefail`, and find on a missing
          # directory fails the whole step. The md/txt branch never creates it, and a
          # .docx with no images may not either.
          mkdir -p "$WORK_DIR" "$WORK_DIR/media"
          TARGET="$WORK_DIR/request-details.md"

          EXT=$(echo "${REQUEST_FILE##*.}" | tr '[:upper:]' '[:lower:]')
          case "$EXT" in
            md|markdown|txt)
              cp "$REQUEST_FILE" "$TARGET"
              echo "Already text - copied as-is."
              ;;
            docx)
              # `apt-get update` is most of the eleven seconds this used to cost, and
              # the runner's package lists are fresh enough to install pandoc without
              # it. Fall back to the full update only if the quick path fails.
              command -v pandoc >/dev/null 2>&1 \
                || sudo apt-get install -y -qq --no-install-recommends pandoc >/dev/null 2>&1 \
                || { sudo apt-get update -qq && sudo apt-get install -y -qq pandoc; }
              pandoc -f docx -t gfm --wrap=none \
                     --extract-media="$WORK_DIR/media" \
                     -o "$TARGET" "$REQUEST_FILE"
              echo "Converted $REQUEST_FILE with pandoc."
              ;;
            doc)
              echo "::error::Legacy binary .doc cannot be converted. Push .docx or markdown."
              exit 1
              ;;
            *)
              echo "::error::Unsupported request format '.$EXT' ($REQUEST_FILE)."
              exit 1
              ;;
          esac

          # A document that extracts to almost nothing means the conversion failed
          # or the file is image-only. Fail here rather than write an empty PDD.
          BYTES=$(wc -c < "$TARGET" | tr -d ' ')
          if [ "$BYTES" -lt 200 ]; then
            echo "::error::Request extracted to only ${BYTES} bytes - nothing usable to build a PDD from."
            exit 1
          fi

          IMAGES=$(find "$WORK_DIR/media" -type f 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "### 2. Request read"
            echo ""
            echo "\`$REQUEST_FILE\` -> ${BYTES} bytes of markdown, ${IMAGES} image(s) extracted."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "--- first 120 lines of the extracted markdown ---"
          head -120 "$TARGET"

      # Section list and the [SME REVIEW] / [DEFAULT] conventions are aligned with
      # the uipath-planner skill's PDD extraction rules, so the SDD stage can
      # consume this document without a human reshaping it first.
      - name: Run uipath-analyst agent
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ env.AGENT_MODEL }}
          timeout_minutes: '25'
          allowed_tools: "Read,Write,Edit,Glob,Grep,Bash"
          prompt: |
            You are uipath-analyst, a UiPath business analyst. You turn a raw automation
            request into a Process Design Document (PDD) that a solution architect can turn
            straight into an automation SDD.

            INPUT  file: ${{ env.WORK_DIR }}/request-details.md
                         (extracted from ${{ needs.identify.outputs.request_file }})
            OUTPUT file: ${{ needs.identify.outputs.pdd_file }}
            Story key:   ${{ needs.identify.outputs.story_key }}
            Branch:      ${{ needs.identify.outputs.branch }}

            ## Step 1 - read everything available

            Read the INPUT file in full. It is the SME's own process document converted from
            Word, so expect pandoc artefacts: tables rendered as pipe tables or as raw HTML,
            image placeholders, stray anchors, hard line breaks mid-sentence. Read through
            them - the content matters, the formatting does not.

            Mine it exhaustively: every step, system, business rule, threshold, field name,
            volume figure and concrete example value it contains must land somewhere in the
            PDD.

            Images extracted from the document are under ${{ env.WORK_DIR }}/media when it
            exists - Read the PNG/JPEG ones for field names and sample values, which
            belong in the step table of section 5. Skip `.emf` / `.wmf`: they cannot be
            rendered, so note in section 10 that a figure was unreadable rather than
            guessing at it.

            Also read `README.md` for repo and naming context. If the document references an
            appendix or attachment whose content is not actually present, record that in
            section 10 as a missing input - do not invent what it might have said.

            ## Step 2 - write the PDD

            Write the document to the OUTPUT path with the Write tool. Use EXACTLY these
            headings, in this order, all of them present even when thin:

                # PDD - <process title>

                ## Document History
                ${{ env.PDD_SECTIONS }}

            What each section must contain:

            Document History (unnumbered, directly under the H1) - a markdown table with
            columns `Date | Version | Author | Role | Comments`, newest row last. This PDD
            is a LIVING document: it is never renamed and never superseded by a second
            file, so this table is the only human-readable record of what changed and
            why. On a first analysis write exactly one row - today's date, version 0.1,
            `uipath-analyst`, `Analyst`, and a comment naming the source request document
            you worked from. On a revision add a row rather than editing the last one, and
            its comment must NAME the change-request document that caused the change.
            Never leave the table empty and never write a row with an empty comment.

            1. Document Control - markdown table: Document, Story key, Epic key, Source file,
               Branch, Author (uipath-analyst), Status (Draft - pending SME approval), Version 0.1.
            2. Introduction - process name, the official "Process Full Name" in PascalCase
               (e.g. `NoPoInvoiceFinder`) on its own table row since the SDD uses it as the
               project-name prefix, business objective, owning department, and a Delivery Team
               table with only the roles the source actually names (SME / Process Owner / BA /
               Developer). Never invent a person.
            3. Process Overview - one markdown table with these rows, every row present:
               Process full name, Function and department, Short description, Required roles,
               Trigger and schedule, Volume (items per day / peak), Average handling time
               (manual vs automated target), FTE effort, Estimated exception rate,
               Input data, Output data.
            4. To-Be Process (High Level) - the target process intent, what becomes automated
               and what stays human. Business-level, not technical design. Re-engineer for
               automation rather than transcribing how the work is done today, and name the
               manual steps that disappear.
            5. Detailed Process Steps - the core section. A markdown table with columns
               `Step | Action | Application | Expected Result | Remarks`. Number steps
               hierarchically (1.1, 1.2, 1.5.A ...). Mark the per-item loop boundaries and every
               decision point explicitly in the Action or Remarks cell. Aim for real granularity:
               one row per action a robot would perform, not one row per phase.
            6. Applications and Systems - table: `Application | Interface type (web/desktop/API/
               terminal/email) | Access method | Login method | Credential handling | Comments`.
               For email, state the protocol signal (IMAP / Exchange / O365 Graph / SMTP) or mark
               it `[SME REVIEW]` - never default to O365. For document storage, never assume
               SharePoint.
            7. Business Rules - table `ID | Rule | Source | Applies at step`.
               YOUR rule IDs are `BR-01`, `BR-02`, ... `BR-nn`: the letters BR, a hyphen,
               and EXACTLY TWO digits, zero-padded. Never `BR-1`, never `BR-003`. Use that
               one form every single time you refer to one of YOUR rules - in the ID column,
               in step remarks, in section 8, in section 10, in prose, in parentheses,
               anywhere. Two widths for the same rule turn one rule into two for every stage
               that reads this document: they match IDs as exact strings, so the SDD hunts
               for rules that do not exist and the review stage reviews phantoms. The
               validator rejects a section 7 ID column that mixes widths.
               The SME document usually numbers its own rules, and often differently
               (`BR-001`, `R5`, `Rule 3`). Quote that number EXACTLY as the source wrote it,
               and ONLY inside a `Source` cell - that is what makes the rule traceable. Never
               carry a source number into prose or into any other column: write
               `contradicts BR-07` in section 10, not `contradicts BR-007`, even when you are
               discussing the sentence the source numbered BR-007. Source cell = their
               numbering, everywhere else = yours.
               Extract rules buried in prose and in step remarks. Every rule must be traceable to
               a sentence in the source; a rule you cannot trace does not belong here.
            8. Business Exceptions - table `ID | Name | Trigger step | Trigger condition | Action`,
                IDs B1, B2... Preserve any catch-all handler as the last row.
            9. System Errors - table `ID | Name | Trigger condition | Severity | Retry policy |
                Action`, IDs S1, S2... If the source has none, add the common infrastructure
                errors (application unresponsive, element not found, network timeout, credential
                expiry, unhandled exception) and mark each `[DEFAULT]`.
            10. Assumptions, Dependencies and Open Questions - numbered list, ONE LINE
                each, at most 12 lines. Format each as
                `**OQ-nn - <short title>.** <one sentence>` for a question, or
                `**<short title>.** <one sentence>` for an assumption or dependency.
                `[SME REVIEW]` marks a business decision only a human can make, `[DEFAULT]`
                a safe engineering default you applied. The architecture stage reads the
                OQ titles from this list, so the TITLE carries the meaning - do not write a
                paragraph of context under each one, and do not restate the source.
            11. Success Criteria - the measurable acceptance criteria: what must be
                demonstrably true for sign-off, one testable line each, at most 8 lines.
                No benefit estimates - hours saved, error reduction, cycle time - nothing
                downstream reads them.

            ## Length budget - this is a contract, not a suggestion

            You write this document in ONE `Write` call, and that call streams at about
            190 characters per second. The last PDD was 30,762 characters, so the write
            alone took 163 seconds - nearly the whole stage. Every character you do not
            write is time the demo gets back.

            Whole document: aim for **about 15 KB**. This is a target to write TOWARD in
            one pass, not a line to check against afterwards: there is no ceiling, no
            measuring, and no second write. Whatever you produce first is what ships.
            Per section, measured
            against the last run so you can see where the weight actually is:

            | Section | Last run | Budget | What changes |
            | --- | --- | --- | --- |
            | 1-2. Document Control, Introduction | 1.1 KB | 1.0 KB | Already right. |
            | 3. Process Overview | 1.2 KB | 1.0 KB | Already right. One table, every row present. |
                        | 4. To-Be Process (High Level) | 1.5 KB | **0.9 KB** | The target intent in a short paragraph plus bullets. Section 6 carries the detail - do not pre-narrate it here. |
            | 4. Detailed Process Steps | 3.4 KB | 3.4 KB | **Do NOT squeeze this one.** It is the core of the document and the SDD's execution flow is built from it. |
            | 4. Applications and Systems | 1.1 KB | 1.1 KB | Already right. |
            | 4. Business Rules | 1.5 KB | 1.5 KB | Every BR-xx stays. Traceability is validated. |
            | 4. Business Exceptions | 0.7 KB | 0.7 KB | Already right. |
            | 4. System Errors | 1.5 KB | 1.2 KB | One table row per error. |
                        | 4. Assumptions, Dependencies, Open Questions | 2.2 KB | **1.4 KB** | One line each, 12 max. This was the second-largest section in the last PDD and almost all of it was context nobody reads. |
            | 11. Success Criteria | 1.7 KB | **0.8 KB** | One testable line each, 8 max. |

            The budget is spent on 5 and 7 - the sections the SDD and the build are
            built from. It is not spent on restating the source document, on explaining
            your reasoning, or on context under an open question.

            Two things the budget does NOT license. Do not drop a required section to
            make room - all eleven are mandatory and the validator fails a missing one.
            Do not thin a table to hit a number: every step, field, business rule,
            exception and error the source names must appear, and it is the PROSE around
            the tables that gives way.

            ## Hard rules

            - **Do not use the TodoWrite tool.** This is a read-one-source, write-one-document
              task: a checklist costs a model round trip per call and puts nothing in the PDD.
              Plan before you write, then write. This changes your process, NOT the document -
              every section requirement above still applies in full, at the same depth. The
              Step 3 self-check and the validator both grade the file, not how you got there.
            - NEVER invent a business rule, threshold, volume figure, system name, URL, person or
              credential. If it is not in the source and not a stated engineering default, it is
              an `[SME REVIEW]` line in section 10.
            - Inference that follows directly from the source IS allowed and expected - label it.
              A reasonable inferred step is better than an empty section, as long as it is marked
              so the SME can correct it.
            - Mark every inferred or defaulted cell inline with `[SME REVIEW]` or `[DEFAULT]`.
              These markers are read by the downstream SDD stage; they are load-bearing, not
              decoration.
            - Tables must be valid GitHub markdown with a header separator row.
            - Do not use HTML. Do not wrap the whole document in a code fence.
            - Write a real document, not a template: no `<placeholder>` text, no "TBD",
              no "Lorem ipsum", no empty table bodies.
            - The document must stand on its own - an architect reading only this file must be
              able to design the automation.
            - Do NOT modify, move or delete anything under ${{ env.WORK_DIR }} or
              ${{ needs.identify.outputs.request_file }}.
            - Do NOT run git commit, git push, or gh. The workflow handles that.
            - Write exactly one file: ${{ needs.identify.outputs.pdd_file }}.

            ## Step 3 - self-check before you finish - ONE command, nothing else

            Confirm every heading in the list above is present, and no others:

                grep -c '^## [0-9]' ${{ needs.identify.outputs.pdd_file }}
                printf '%s\n' "$PDD_SECTIONS" | grep -c '^## '

            The two numbers must be equal (`PDD_SECTIONS` is in your environment; it
            is the same list). If they are not, add the missing heading and stop.
            Do NOT run `wc -c`. Do NOT trim, tidy or rewrite the file for any other
            reason - the validator has a size FLOOR (4 KB) and no ceiling, so a document
            a few hundred bytes over the target is finished, not a defect. The run before
            this one wrote the whole PDD a second time to remove 309 bytes; that rewrite
            cost 84 seconds and changed nothing the pipeline reads.

      # Document History is the one heading an agent reliably drops: it is the only
      # UNNUMBERED heading in a 17-heading contract, so a model marching from the H1
      # into '## 1.' skips straight past it. It cost a repair pass on more than one
      # run - roughly a minute of agent time to add six lines whose content is
      # entirely predictable on a first write.
      #
      # So write it here instead of asking an agent to. This only ever fires when the
      # heading is absent; an existing table, including one with revision rows, is
      # never touched.
      - name: Ensure Document History
        env:
          PDD_FILE:     ${{ needs.identify.outputs.pdd_file }}
          REQUEST_FILE: ${{ needs.identify.outputs.request_file }}
        run: |
          set -euo pipefail
          [ -f "$PDD_FILE" ] || { echo "no PDD yet - nothing to seed"; exit 0; }
          if grep -qxF '## Document History' "$PDD_FILE"; then
            echo "Document History already present - left untouched."
            exit 0
          fi
          echo "::warning::$PDD_FILE had no '## Document History' - inserting the first-run table."
          python3 - "$PDD_FILE" "${REQUEST_FILE:-the source request document}" <<'EOF_DH'
          import datetime, sys

          path, source = sys.argv[1], sys.argv[2]
          lines = open(path, encoding="utf-8").read().split("\n")

          table = [
              "## Document History",
              "",
              "| Date | Version | Author | Role | Comments |",
              "|---|---|---|---|---|",
              f"| {datetime.date.today():%Y-%m-%d} | 0.1 | uipath-analyst | Analyst | "
              f"Initial PDD created from {source}. |",
              "",
          ]

          # Directly after the H1, which is where the contract puts it. If there is no
          # H1 the validator fails on that separately, so prepend and let it say so.
          at = next((i for i, l in enumerate(lines) if l.startswith("# ")), None)
          if at is None:
              lines = table + lines
          else:
              at += 1
              while at < len(lines) and not lines[at].strip():
                  at += 1
              lines[at:at] = table

          open(path, "w", encoding="utf-8").write("\n".join(lines))
          print(f"inserted Document History at line {at + 1}")
          EOF_DH

      # Soft validation, then one repair pass, then a hard gate. A single weak
      # agent run must not put a half-empty PDD in front of a reviewer.
      # Fail fast, with the actual reason, if the validator on this branch predates
      # the contract in this workflow. Without this the symptom is ten "missing
      # section" errors and a repair that rebuilds the old shape - 2.5 minutes to
      # learn that one file was not uploaded.
      - name: Refuse a stale validator
        run: |
          if ! grep -q 'PDD_SECTIONS' .github/scripts/validate-pdd.sh; then
            echo "::error::.github/scripts/validate-pdd.sh predates this workflow: it carries its own section list instead of reading PDD_SECTIONS. Upload the current validate-pdd.sh alongside uipath-pdd.yml."
            exit 1
          fi
          echo "validator reads PDD_SECTIONS - contract is single-sourced."

      - name: Validate PDD
        id: check
        continue-on-error: true
        env:
          PDD_FILE: ${{ needs.identify.outputs.pdd_file }}
        run: bash .github/scripts/validate-pdd.sh "$PDD_FILE"

      - name: Repair PDD
        if: steps.check.outcome == 'failure'
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ env.AGENT_MODEL }}
          timeout_minutes: '20'
          allowed_tools: "Read,Write,Edit,Glob,Grep,Bash"
          prompt: |
            The PDD at ${{ needs.identify.outputs.pdd_file }} failed validation.

            Run the validator to see exactly what is wrong:

                bash .github/scripts/validate-pdd.sh ${{ needs.identify.outputs.pdd_file }}

            Then read ${{ env.WORK_DIR }}/request-details.md and fix the PDD so the validator
            passes. The required headings are EXACTLY these, in this order - the same list
            the validator checks against, from `$PDD_SECTIONS` in your environment:

            ${{ env.PDD_SECTIONS }}

            Real content in every section, no placeholder text, no empty tables. Never
            add a heading that is not in that list and never renumber to make room for
            one - a repair once re-added two sections the design had deliberately removed.
            If the file is missing entirely, write it from scratch. Re-run the validator
            until it exits 0.

            Do not modify anything under ${{ env.WORK_DIR }}. Do not run git or gh.

      - name: Verify PDD
        env:
          PDD_FILE: ${{ needs.identify.outputs.pdd_file }}
        run: |
          set -euo pipefail
          bash .github/scripts/validate-pdd.sh "$PDD_FILE"
          {
            echo "### 3. PDD generated"
            echo ""
            echo "\`$PDD_FILE\` - $(wc -c < "$PDD_FILE" | tr -d ' ') bytes, $(grep -c '^## [0-9]' "$PDD_FILE") sections."
          } >> "$GITHUB_STEP_SUMMARY"

      # Pushing with GITHUB_TOKEN does not re-trigger this workflow, so there is
      # no loop. Only the PDD is staged - the extracted markdown stays local.
      - name: Commit PDD
        env:
          PDD_FILE:  ${{ needs.identify.outputs.pdd_file }}
          STORY_KEY: ${{ needs.identify.outputs.story_key }}
          BRANCH:    ${{ needs.identify.outputs.branch }}
          SOURCE:    ${{ needs.identify.outputs.request_file }}
          LEGACY_PDD: ${{ needs.identify.outputs.legacy_pdd }}
        run: |
          set -euo pipefail
          git config user.name  "uipath-analyst[bot]"
          git config user.email "uipath-analyst[bot]@users.noreply.github.com"

          # `git mv` rather than `mv` so the rename is staged as a rename and the old
          # path cannot linger as an unstaged deletion the commit would miss.
          if [ -n "${LEGACY_PDD:-}" ] && [ -f "$LEGACY_PDD" ] && [ "$LEGACY_PDD" != "$PDD_FILE" ] && [ ! -e "$PDD_FILE" ]; then
            git mv "$LEGACY_PDD" "$PDD_FILE" 2>/dev/null || mv "$LEGACY_PDD" "$PDD_FILE"
            echo "renamed $LEGACY_PDD -> $PDD_FILE"
          fi

          git add "$PDD_FILE"
          # -A so a rename above is staged as a deletion too, not just an add.
          git add -A "$DOCS_DIR"
          if git diff --cached --quiet; then
            echo "No change to commit - PDD is already up to date."
          else
            git commit -m "docs: add PDD for $STORY_KEY" \
                       -m "Generated by uipath-analyst from $SOURCE."
            git push origin "HEAD:$BRANCH"
          fi

  # ═══════════════════════════════════════════════════════════════
  # 4. Open PR
  # This is the Maestro resume signal. No auto-merge.
  # ═══════════════════════════════════════════════════════════════
  open-pr:
    name: Open PR
    needs: [identify, generate-pdd]
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url:    ${{ steps.pr.outputs.pr_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identify.outputs.branch }}
          fetch-depth: 1

      - name: Open PR into develop
        id: pr
        env:
          # GITHUB_TOKEN deliberately, NOT a PAT. This PR is the one human gate in
          # the chain: it must be approvable BY the assignee, and GitHub does not let
          # anyone approve their own pull request. A PAT would make the assignee the
          # author and disable the Approve button on the very PR they are meant to
          # approve. Bot authorship keeps that gate usable.
          #
          # Nothing downstream needs this PR to trigger a workflow - Maestro resumes
          # off a polled PR event, not an Actions run - so the usual reason to reach
          # for a PAT does not apply here.
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          REPO:      ${{ github.repository }}
          BRANCH:    ${{ needs.identify.outputs.branch }}
          STORY_KEY: ${{ needs.identify.outputs.story_key }}
          PDD_FILE:  ${{ needs.identify.outputs.pdd_file }}
          SOURCE:    ${{ needs.identify.outputs.request_file }}
        run: |
          set -euo pipefail

          if [ -f "$PDD_FILE" ]; then
            TITLE_LINE=$(grep -m1 '^# ' "$PDD_FILE" | sed 's/^# *//' || echo "PDD for $STORY_KEY")
          else
            TITLE_LINE="PDD for $STORY_KEY"
          fi
          BLOB="${{ github.server_url }}/$REPO/blob/$BRANCH"

          EXISTING=$(gh pr list --repo "$REPO" --head "$BRANCH" --base "$BASE_BRANCH" \
                       --state open --json number --jq '.[0].number' || echo "")

          cat > /tmp/pr-body.md <<'EOF_BODY'
          ## Process Design Document for review

          The analysis agent read the request document pushed to this branch and produced a
          full PDD, ready to be turned into a solution design.

          **Review checklist**
          - [ ] Detailed process steps (section 5) are complete and in the right order
          - [ ] Business rules (section 7) are correct and none are missing
          - [ ] Every `[SME REVIEW]` item in section 10 is answered or accepted

          Merging this PR approves the PDD and advances the case to solution design.
          EOF_BODY

          {
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Story | \`$STORY_KEY\` |"
            echo "| PDD | [\`$PDD_FILE\`]($BLOB/$PDD_FILE) |"
            echo "| Request | [\`$SOURCE\`]($BLOB/$SOURCE) |"
            echo ""
            echo "<sub>Generated by \`uipath-pdd\` - run [${{ github.run_id }}](${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }})</sub>"
          } >> /tmp/pr-body.md

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "PR #$EXISTING already open for $BRANCH - updating it."
            gh pr edit "$EXISTING" --repo "$REPO" \
              --title "docs: $TITLE_LINE" --body-file /tmp/pr-body.md
            PR_NUMBER="$EXISTING"
          else
            gh pr create --repo "$REPO" \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --title "docs: $TITLE_LINE" \
              --body-file /tmp/pr-body.md
            PR_NUMBER=$(gh pr list --repo "$REPO" --head "$BRANCH" --base "$BASE_BRANCH" \
                          --state open --json number --jq '.[0].number')
          fi

          # Maestro is blocked on this event, so a silent failure stalls the whole
          # case - fail loudly instead.
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "::error::PR from $BRANCH into $BASE_BRANCH was not created. Maestro will not resume."
            exit 1
          fi

          PR_URL=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json url --jq .url)
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL"       >> "$GITHUB_OUTPUT"

          {
            echo "### 4. PR opened"
            echo ""
            echo "[#$PR_NUMBER - docs: $TITLE_LINE]($PR_URL) into \`$BASE_BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Opened/updated PR #$PR_NUMBER -> $PR_URL"

      - name: Assign and request review
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          REPO:      ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL:    ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail

          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-assignee "$ASSIGNEE"
          echo "Assigned PR #$PR_NUMBER to $ASSIGNEE."

          # Best effort: GitHub rejects a review request when the target is the PR
          # author. With the bot authoring this PR that should not happen, but the
          # fallback stays - it costs nothing and covers a token swap made later.
          if gh pr edit "$PR_NUMBER" --repo "$REPO" --add-reviewer "$ASSIGNEE" 2>/dev/null; then
            echo "Requested review from $ASSIGNEE."
          else
            echo "::notice::Review not requested from $ASSIGNEE (likely the PR author). Assignee is set."
          fi

          {
            echo "### 5. PR assigned"
            echo ""
            echo "[#$PR_NUMBER]($PR_URL) assigned to \`$ASSIGNEE\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Observe - Analysis in review
        # A dashboard write must never fail the pipeline: observe.sh uses `set -e`, so
        # a rate limit or a transient 5xx would otherwise take a good stage down with it.
        continue-on-error: true
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          REPO:       ${{ github.repository }}
          PR_NUMBER:  ${{ steps.pr.outputs.pr_number }}
          PR_URL:     ${{ steps.pr.outputs.pr_url }}
          STORY_KEY:  ${{ needs.identify.outputs.story_key }}
          PDD_FILE:   ${{ needs.identify.outputs.pdd_file }}
          BRANCH:     ${{ needs.identify.outputs.branch }}
        run: |
          set -euo pipefail

          bash .github/scripts/observe.sh stage Analysis status=in-review decidedBy=human \
            task="PDD ready for review" \
            pr="$PR_NUMBER" prUrl="$PR_URL" story="$STORY_KEY"

          # Linked on the analysis branch, where it exists right now. The same
          # path resolves on develop once the PR is merged.
          bash .github/scripts/observe.sh document pdd path="$PDD_FILE" \
            url="https://github.com/${{ github.repository }}/blob/$BRANCH/$PDD_FILE"

  # ═══════════════════════════════════════════════════════════════
  # 5. Assign PR
  # ═══════════════════════════════════════════════════════════════
  # Without this a crashed run leaves Analysis on `running` and the card spins
  # for ever. Runs only when something above actually failed.
  # ═══════════════════════════════════════════════════════════════
  faulted:
    name: Record fault
    needs: [identify, generate-pdd, open-pr]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Observe - Analysis faulted
        # A dashboard write must never fail the pipeline: observe.sh uses `set -e`, so
        # a rate limit or a transient 5xx would otherwise take a good stage down with it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          bash .github/scripts/observe.sh stage Analysis status=faulted \
            task="Analysis run failed" run=${{ github.run_id }} \
            runUrl=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
