name: uipath-deploy

# Stage 6 of the ADLC chain, as four visible jobs:
#
#   Resolve target -> Build package -> Deploy -> Verify
#
# Unlike every other stage this one has no branch and writes no document - it runs on
# the promotion to main, i.e. once the Development PR is merged into develop and
# develop is merged into main. Maestro or Flow can also fire it directly with
# workflow_dispatch, which is why every input has a sane default.
#
# THE TARGET SHAPE, fixed for this programme:
#   a UiPath SOLUTION containing exactly ONE API Workflow project.
# `sdd_scope: single-product` means one PROJECT INSIDE that solution. It has never
# meant "no solution" - every build is packed and shipped as a solution - and reading
# it that way is what made the deploy step hunt for .nupkg files and skip the deploy.
#
# So this workflow ships a SOLUTION, and decides how by looking at what `Build
# package` actually produced - never at `sdd_scope`. The per-project .nupkg path
# below is a fallback for a build that produced no solution at all; it is not the
# single-product path, because there is no such thing.
#
# Jira is NOT touched from here - Flow owns every Jira transition in this chain.
#
# Required repo configuration:
#   secrets: UIPATH_STAGING_CLIENT_ID, UIPATH_STAGING_CLIENT_SECRET
#   vars:    UIPATH_STAGING_ORGANIZATION, UIPATH_STAGING_TENANT,
#            UIPATH_STAGING_AUTHORITY, UIPATH_STAGING_FOLDER_PATH_FUSION
#
# All eight are ORGANIZATION-level, so a repo generated from the template inherits
# them with no per-repo setup. Their visibility is "Public repositories" - a
# PRIVATE repo in the same org resolves every one of them to an empty string and
# fails at the presence check below, which is the intended tripwire rather than a
# bug. The STAGING_ prefix is deliberate: it keeps a production credential from
# ever being picked up by a workflow that means to target staging.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      folder_path:
        description: 'Orchestrator folder path to deploy into (blank = the UIPATH_STAGING_FOLDER_PATH_FUSION variable)'
        required: false
        default: ''
      dry_run:
        description: 'Pack only - do not log in, publish or deploy'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCS_DIR: docs
  CODE_DIR: code
  OUTPUT_DIR: ./dist
  CLI_VERSION: '1.202.0'
  NODE_VERSION: '20'

permissions:
  # write, not read: observe.sh PUTs observability.json through the contents
  # API, and the workflow permissions block caps what GITHUB_TOKEN may do.
  # Under `read` every status write 403s, including the faulted job - so a
  # failed deploy could not even report that it had failed.
  contents: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ═══════════════════════════════════════════════════════════════
  # 1. Resolve target
  # The design decides the shipping path, not this file.
  # ═══════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════
  # 0. Anything to deploy?
  # Generating a repo from the template writes the template's files as an initial
  # commit on main, and `on: push: branches: [main]` cannot tell that commit apart
  # from a real release merge - so without this the very first thing a new repo does
  # is fail a deploy. The old behaviour was a red X on a repo nobody had used yet.
  #
  # The test is for SUBSTANCE rather than for "is this the first commit": a repo is
  # deployable when it has both a design contract and a real project to build. A
  # freshly generated repo has neither - `code/` holds a README and nothing else -
  # so it skips cleanly and stays green. `github.event.created` would also catch the
  # generation commit, but it would miss every other empty-repo push (a README edit,
  # a workflow tweak merged to main before any code exists), and those fail the same
  # way for the same reason.
  #
  # A manual dispatch bypasses this on purpose: asking for a deploy explicitly should
  # produce a real error when there is nothing to deploy, not a silent success.
  # ═══════════════════════════════════════════════════════════════
  guard:
    name: Anything to deploy?
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.check.outputs.deployable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Look for a design contract and a buildable project
        id: check
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch - proceeding regardless."
            exit 0
          fi

          ARCH=$(find "$DOCS_DIR" -maxdepth 1 -type f -name 'architecture-*.json' 2>/dev/null | head -1 || true)

          # README.md alone is template scaffolding, not a build.
          PROJECT=$(find "$CODE_DIR" -maxdepth 4 -type f \
                      \( -name 'project.json' -o -name 'project.uiproj' -o -name 'Workflow.json' \
                      -o -name '*.xaml' -o -name 'agent.json' -o -name 'uipath.json' \
                      -o -name '*.flow' -o -name 'caseplan.json' -o -name 'entry-points.json' \) \
                    2>/dev/null | head -1 || true)

          if [ -n "$ARCH" ] && [ -n "$PROJECT" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "Design: $ARCH"
            echo "Project: $PROJECT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to deploy yet - skipping."
            {
              echo "### Deploy skipped"
              echo ""
              echo "This branch has no release to ship yet, so the deploy stage stopped before doing any work."
              echo ""
              echo "| Needed | Found |"
              echo "| --- | --- |"
              echo "| \`$DOCS_DIR/architecture-*.json\` | ${ARCH:-**missing**} |"
              echo "| a UiPath project under \`$CODE_DIR/\` | ${PROJECT:-**missing**} |"
              echo ""
              echo "This is the expected state for a repository just created from the template."
              echo "The stage runs by itself once the Development and Docs PRs reach \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  resolve:
    name: Resolve target
    needs: guard
    if: needs.guard.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    outputs:
      scope:         ${{ steps.r.outputs.scope }}
      product:       ${{ steps.r.outputs.product }}
      solution_name: ${{ steps.r.outputs.solution_name }}
      version:       ${{ steps.r.outputs.version }}
      folder_path:   ${{ steps.r.outputs.folder_path }}
      arch_file:     ${{ steps.r.outputs.arch_file }}
      packages:      ${{ steps.r.outputs.packages }}
      solution_dir:  ${{ steps.r.outputs.solution_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Observe - Production in progress
        # A dashboard write must never fail the pipeline: observe.sh uses `set -e`, so
        # a rate limit or a transient 5xx would otherwise take a good stage down with it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          bash .github/scripts/observe.sh stage Production status=in-progress \
            task="Deploying" run=${{ github.run_id }}

      - name: Read the design
        id: r
        run: |
          set -euo pipefail

          ARCH_FILE=$(find "$DOCS_DIR" -maxdepth 1 -type f -name 'architecture-*.json' 2>/dev/null | sort | tail -1 || true)
          if [ -z "${ARCH_FILE:-}" ]; then
            echo "::error::No $DOCS_DIR/architecture-*.json on this branch - nothing to deploy."
            echo "::error::The Architecture and Development PRs must be merged through to main first."
            exit 1
          fi
          python3 -c "import json,sys;json.load(open(sys.argv[1]))" "$ARCH_FILE" \
            || { echo "::error::$ARCH_FILE is not valid JSON."; exit 1; }

          SCOPE=$(python3   -c "import json;print(json.load(open('$ARCH_FILE'))['sdd_scope'])")
          PRODUCT=$(python3 -c "import json;print(json.load(open('$ARCH_FILE'))['primary_product'])")
          # The solution package, the deployment and the Orchestrator sub-folder all
          # take architecture.json's `solution_name` - <process-base>-<epic-number>,
          # see architectural-considerations.md §4 "Naming". This used to read
          # `process_name` (PascalCase, no epic number) while uipath-develop packed
          # under the repository name, so the published package and the deployment
          # disagreed; and because the name carried no epic number, a second lifecycle
          # of the same process hit a folder `deploy run` refuses to recreate and had
          # to be upgraded by hand. Older contracts predate the field, so fall back.
          NAME=$(python3 -c "
          import json
          d=json.load(open('$ARCH_FILE'))
          n=d.get('solution_name')
          if not n:
              base=d.get('process_kebab') or ''
              epic=d.get('epic_number') or ''
              n=(base+'-'+epic) if base and epic else (base or d.get('process_name',''))
          print(n)")
          if [ -z "$NAME" ]; then
            echo "::error::$ARCH_FILE yields no solution name - it has neither solution_name nor process_kebab."
            exit 1
          fi
          VERSION="1.0.${{ github.run_number }}"

          FOLDER_PATH="${{ inputs.folder_path }}"
          [ -n "$FOLDER_PATH" ] || FOLDER_PATH="${{ vars.UIPATH_STAGING_FOLDER_PATH_FUSION }}"
          if [ -z "$FOLDER_PATH" ]; then
            echo "::error::No Orchestrator folder. Set the UIPATH_STAGING_FOLDER_PATH_FUSION variable (org or repo level) or pass folder_path."
            exit 1
          fi

          # Project folders are named by the coding agent, not by the design, so
          # they are discovered on disk rather than derived. uipath-develop already
          # works this way; deriving code/<kebab> here was the one place that
          # guessed, and it guessed wrong every time `uip` scaffolded a solution as
          # code/<solution>/<Project>/.
          SOLUTION_DIR=$(find "$CODE_DIR" -maxdepth 3 -type f \
                           \( -name '*.uipx' -o -name 'solution.json' \) \
                           -not -path "*/dist/*" -not -path "*/obj/*" \
                           -exec dirname {} \; 2>/dev/null | sort -u | head -1 || true)

          # Only used when there is no solution manifest, where each project ships
          # its own package.
          PACKAGES=$(find "$CODE_DIR" -maxdepth 3 -type f \
                       \( -name 'project.uiproj' -o -name 'project.json' \
                          -o -name 'uipath.json' -o -name 'agent.json' \) \
                       -not -path "*/dist/*" -not -path "*/obj/*" \
                       -exec dirname {} \; 2>/dev/null | sort -u | tr '\n' ' ' || true)

          if [ -n "${SOLUTION_DIR:-}" ]; then
            echo "Solution manifest found in $SOLUTION_DIR - packing as a solution."
          elif [ -z "${PACKAGES// /}" ]; then
            echo "::error::No solution manifest and no project directory under $CODE_DIR/."
            echo "::error::Nothing to pack. What is actually on disk:"
            find "$CODE_DIR" -type f | head -40
            exit 1
          fi

          {
            echo "scope=$SCOPE"
            echo "product=$PRODUCT"
            echo "solution_name=$NAME"
            echo "version=$VERSION"
            echo "folder_path=$FOLDER_PATH"
            echo "arch_file=$ARCH_FILE"
            echo "packages=$PACKAGES"
            echo "solution_dir=$SOLUTION_DIR"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 1. Deployment target resolved"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Design | \`$ARCH_FILE\` |"
            echo "| Scope | \`$SCOPE\` |"
            echo "| Primary product | \`$PRODUCT\` |"
            echo "| Name | \`$NAME\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Folder | \`$FOLDER_PATH\` |"
            echo "| Shipping path | $([ -n "${SOLUTION_DIR:-}" ] && echo 'Solution (.uipx)' || echo 'single package per project') |"
            echo "| Dry run | \`${{ inputs.dry_run }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Scope=$SCOPE product=$PRODUCT name=$NAME version=$VERSION folder=$FOLDER_PATH"
          echo "Packages: ${PACKAGES:-<solution>}"

  # ═══════════════════════════════════════════════════════════════
  # 2. Build package
  # ═══════════════════════════════════════════════════════════════
  build:
    name: Build package
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm global (@uipath/cli)
        uses: actions/cache@v4
        with:
          path: ~/.npm-global/lib/node_modules
          key: uip-${{ env.CLI_VERSION }}-${{ runner.os }}

      - name: Install UiPath CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          command -v uip >/dev/null || npm install -g "@uipath/cli@${CLI_VERSION}"
          # Freeze the CLI at the exact version: without an exact (three-part) pin its
          # daily auto-updater pulls the newest patch in the line on first use, so the
          # deploy could run on a CLI nobody rehearsed with.
          case "$CLI_VERSION" in
            *.*.*) uip config set version "$CLI_VERSION" --output json >/dev/null 2>&1 || true ;;
          esac
          uip --version

      - name: Pack
        env:
          SCOPE:    ${{ needs.resolve.outputs.scope }}
          PRODUCT:  ${{ needs.resolve.outputs.product }}
          NAME:     ${{ needs.resolve.outputs.solution_name }}
          VERSION:  ${{ needs.resolve.outputs.version }}
          PACKAGES: ${{ needs.resolve.outputs.packages }}
          SOLUTION_DIR: ${{ needs.resolve.outputs.solution_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"

          if [ -n "${SOLUTION_DIR:-}" ]; then
            # One .uipx for the whole solution, packed from wherever the manifest
            # actually lives. resolve found that on disk - it is not assumed to sit
            # at the top of code/, because `uip` scaffolds code/<solution>/<Project>/.
            echo "Packing solution from $SOLUTION_DIR"
            uip solution pack "$SOLUTION_DIR" "$OUTPUT_DIR" --name "$NAME" --version "$VERSION"
          else
            # No Solution wrapper: each project publishes its own package. The pack
            # verb is per product and the CLI surface drifts, so an unknown verb is
            # reported with the supported surface rather than silently swallowed.
            case "$PRODUCT" in
              api-workflows) GROUP="api-workflow" ;;
              rpa-process|rpa-library|rpa-test-automation) GROUP="rpa" ;;
              maestro-flow)    GROUP="maestro flow" ;;
              maestro-bpmn)    GROUP="maestro bpmn" ;;
              case-management) GROUP="maestro case" ;;
              agents)          GROUP="agent" ;;
              coded-apps)      GROUP="app" ;;
              *) echo "::error::No pack recipe for product '$PRODUCT'."; exit 1 ;;
            esac

            PACKED=0
            for d in $PACKAGES; do
              if [ ! -d "$d" ]; then
                echo "::warning::$d from the design is not on disk - skipping."
                continue
              fi
              echo "=== uip $GROUP pack ($d) ==="
              if ! ( cd "$d" && uip $GROUP pack --output-dir "$GITHUB_WORKSPACE/$OUTPUT_DIR" ) 2>&1 | tee /tmp/pack.log; then
                if grep -qiE "unknown command|unknown option" /tmp/pack.log; then
                  echo "::error::'uip $GROUP pack' is not supported by CLI $(uip --version). Supported surface:"
                  uip $GROUP --help || true
                fi
                exit 1
              fi
              PACKED=$((PACKED + 1))
            done
            [ "$PACKED" -gt 0 ] || { echo "::error::No project was packed."; exit 1; }
          fi

          echo "=== artifacts ==="
          ls -la "$OUTPUT_DIR"
          COUNT=$(find "$OUTPUT_DIR" -type f \( -name '*.nupkg' -o -name '*.zip' -o -name '*.uipx' \) | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Pack produced no package file in $OUTPUT_DIR."
            exit 1
          fi
          {
            echo "### 2. Package built"
            echo ""
            find "$OUTPUT_DIR" -type f \( -name '*.nupkg' -o -name '*.zip' -o -name '*.uipx' \) \
              -exec sh -c 'echo "- \`$(basename "$1")\` — $(wc -c < "$1" | tr -d " ") bytes"' _ {} \;
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 5
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════
  # 3. Deploy
  # Attach a required reviewer to the uipath-prod environment to gate this.
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy
    needs: [resolve, build]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: uipath-prod
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm global (@uipath/cli)
        uses: actions/cache@v4
        with:
          path: ~/.npm-global/lib/node_modules
          key: uip-${{ env.CLI_VERSION }}-${{ runner.os }}

      - name: Install UiPath CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          command -v uip >/dev/null || npm install -g "@uipath/cli@${CLI_VERSION}"
          # Freeze the CLI at the exact version: without an exact (three-part) pin its
          # daily auto-updater pulls the newest patch in the line on first use, so the
          # deploy could run on a CLI nobody rehearsed with.
          case "$CLI_VERSION" in
            *.*.*) uip config set version "$CLI_VERSION" --output json >/dev/null 2>&1 || true ;;
          esac
          uip --version

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ env.OUTPUT_DIR }}

      - name: Authenticate
        env:
          UIPATH_CLIENT_ID:     ${{ secrets.UIPATH_STAGING_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_STAGING_CLIENT_SECRET }}
          UIPATH_TENANT:        ${{ vars.UIPATH_STAGING_TENANT }}
          UIPATH_AUTHORITY:     ${{ vars.UIPATH_STAGING_AUTHORITY }}
          UIPATH_ORGANIZATION:  ${{ vars.UIPATH_STAGING_ORGANIZATION }}
        run: |
          set -euo pipefail
          for v in UIPATH_CLIENT_ID UIPATH_CLIENT_SECRET UIPATH_TENANT UIPATH_AUTHORITY UIPATH_ORGANIZATION; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is not set. Deployment needs all five."
              exit 1
            fi
          done
          uip login \
            --client-id "$UIPATH_CLIENT_ID" \
            --client-secret "$UIPATH_CLIENT_SECRET" \
            --tenant "$UIPATH_TENANT" \
            --authority "$UIPATH_AUTHORITY" \
            --organization "$UIPATH_ORGANIZATION" \
            --scope "OR.Administration OR.Administration.Read OR.Administration.Write OR.AutomationSolutions.Access OR.Execution OR.Execution.Read OR.Execution.Write OR.Folders OR.Folders.Read OR.Folders.Write OR.Jobs OR.Jobs.Read OR.Jobs.Write AutomationSolutions Solutions.Deployments Solutions.Deployments.Read Solutions.Deployments.Write Solutions.Packages Solutions.Packages.Read Solutions.Packages.Write RCS.FolderAuthorization RCS.TagsManagement"
          echo "Authenticated."

      - name: Publish
        id: publish
        env:
          SCOPE:   ${{ needs.resolve.outputs.scope }}
          NAME:    ${{ needs.resolve.outputs.solution_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # Branch on WHAT WAS BUILT, not on the declared scope. `Build package`
          # already decides by looking for a .uipx manifest under code/, and every
          # build now ships as a solution whatever its scope says - so a
          # `single-product` design still produces `uip solution pack` output
          # (NAME_VERSION.zip). Keying this step on scope instead sent a perfectly
          # good solution zip down the per-project path, which hunts for .nupkg
          # files that a solution build never produces, and failed the deploy with
          # "No .nupkg found to publish".
          PKG=$(find "$OUTPUT_DIR" -type f \( -name '*.uipx' -o -name "${NAME}_${VERSION}.zip" -o -name '*.zip' \) 2>/dev/null | head -1 || true)
          if [ -n "$PKG" ]; then
            echo "Publishing solution $PKG"
            uip solution publish "$PKG"
            # Downstream steps gate on what was ACTUALLY published, not on sdd_scope.
            echo "solution=true" >> "$GITHUB_OUTPUT"
          else
            echo "solution=false" >> "$GITHUB_OUTPUT"
            PUBLISHED=0
            while IFS= read -r pkg; do
              [ -n "$pkg" ] || continue
              echo "=== publishing $(basename "$pkg") ==="
              uip or packages upload --path "$pkg" || {
                echo "::error::Upload failed for $pkg. Supported surface:"; uip or packages --help || true; exit 1; }
              PUBLISHED=$((PUBLISHED + 1))
            done < <(find "$OUTPUT_DIR" -type f -name '*.nupkg' | sort)
            [ "$PUBLISHED" -gt 0 ] || {
              echo "::error::Nothing to publish in $OUTPUT_DIR - no solution package (.uipx / ${NAME}_${VERSION}.zip) and no .nupkg."
              ls -la "$OUTPUT_DIR" 2>/dev/null || echo "  ($OUTPUT_DIR does not exist)"
              exit 1; }
            echo "Published $PUBLISHED package(s)."
          fi

      # Orchestrator indexes a freshly published package asynchronously, so the first
      # deploy attempt routinely reports it as not ready. Retry rather than fail.
      # Gated on what Publish actually shipped, NOT on sdd_scope. Every build now
      # produces a solution whatever its scope says, so a `single-product` run was
      # publishing a solution zip and then SKIPPING this step - the package appeared
      # in Orchestrator and was never deployed, with a green tick on the run.
      - name: Deploy to Orchestrator
        if: steps.publish.outputs.solution == 'true'
        env:
          NAME:        ${{ needs.resolve.outputs.solution_name }}
          VERSION:     ${{ needs.resolve.outputs.version }}
          FOLDER_PATH: ${{ needs.resolve.outputs.folder_path }}
        run: |
          set -uo pipefail
          MAX_ATTEMPTS=10
          DELAY=10
          CONFIG="${RUNNER_TEMP:-/tmp}/deploy-config.json"

          # ── Bind to the EXISTING connections instead of provisioning new ones ──
          # `deploy run` creates a new folder and, by default, provisions a FRESH copy
          # of every resource the package declares - including Integration Service
          # connections. A fresh connection has never been authenticated, so the
          # deployment stops at
          #   [CNS1072] connection <name>: You will need to authenticate this
          #   connection before proceeding further
          # even though a working, authenticated connection of the same name is
          # sitting in the parent folder. The connections are shared programme
          # infrastructure (architectural-considerations.md §4: never create, rename
          # or duplicate them), so every one of them must be LINKED, not installed.
          #
          # Link state lives in the deploy config: a resource with `linkToResource`
          # binds to an existing entity, one without it is provisioned fresh.
          link_connections() {
          # 1. Resolve the folder we are told the connections live in, and prove the
          #    DEPLOYING IDENTITY can see it. This is the check that matters: the CI
          #    authenticates as an external application, not as a person, and
          #    Integration Service connections are account-scoped. A run once listed
          #    three connections from entirely different folders and none of ours,
          #    because the app had no access to this one - and the only symptom was
          #    "Resource '<name>' was not found in folder 'Fusion2026' in the target
          #    environment", three fallbacks deep.
          cat > "${RUNNER_TEMP:-/tmp}/folder_key.py" <<'EOF_FKEY'
          import json, re, sys

          try:
              doc = json.load(sys.stdin)
          except Exception:
              raise SystemExit(0)

          stack = [doc]
          while stack:
              node = stack.pop()
              if isinstance(node, dict):
                  low = {k.lower(): v for k, v in node.items()}
                  for k in ("key", "folderkey", "id"):
                      v = low.get(k)
                      if isinstance(v, str) and re.fullmatch(r"[0-9a-fA-F-]{36}", v):
                          print(v)
                          raise SystemExit(0)
                  stack.extend(node.values())
              elif isinstance(node, list):
                  stack.extend(node)
          EOF_FKEY
          FOLDER_KEY=$(uip or folders get "$FOLDER_PATH" --output json 2>/dev/null \
            | python3 "${RUNNER_TEMP:-/tmp}/folder_key.py")
          if [ -z "$FOLDER_KEY" ]; then
            echo "::error::The deploying account cannot resolve folder '$FOLDER_PATH'."
            echo "::error::It authenticates as an external application, not as you. Grant that application access to '$FOLDER_PATH' in Orchestrator (Manage access), then re-run."
            uip or folders list --output table 2>&1 | head -15
            return 1
          fi
          echo "  folder '$FOLDER_PATH' -> $FOLDER_KEY"

          # 2. The deploy config lists the resources this package will provision.
          uip solution deploy config get "$NAME" -d "$CONFIG" --package-version "$VERSION" --output json >/dev/null 2>&1 \
            || { echo "::warning::Could not fetch the deploy config for $NAME v$VERSION - deploying without link overrides."; return 1; }

          cat > "${RUNNER_TEMP:-/tmp}/list_connections.py" <<'EOF_CONN'
          import json, sys

          try:
              doc = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              raise SystemExit(0)

          for r in (doc.get("resources") or []):
              if "connection" in str(r.get("kind", "")).lower():
                  name = r.get("name")
                  if name:
                      print(name)
          EOF_CONN

          # 3. Advisory only. If a connection the package declares is not visible to
          #    this account, linking it will fail - say so before the 400 rather than
          #    after, but do not let it choose the folder.
          VISIBLE=$(uip is connections list --all-folders --output json 2>/dev/null || true)

          local n=0 total=0
          while IFS= read -r res; do
            [ -n "$res" ] || continue
            total=$((total + 1))

            case "$VISIBLE" in
              *"\"$res\""*) : ;;
              *) echo "::warning::Connection '$res' is not visible to the deploying account. If the link fails, that is why - it needs access to the connection, not just to the folder." ;;
            esac

            # linkToResource.folderPath takes the folder KEY, not its name. The
            # solution's own debug_overwrites.json records the working binding that
            # way: folderFullyQualifiedName "Fusion2026", folderPath "<key>".
            if OUT=$(uip solution deploy config link "$CONFIG" "$res" \
                       --name "$res" --folder-path "$FOLDER_KEY" 2>&1); then
              echo "  linked '$res' -> $FOLDER_PATH ($FOLDER_KEY)"
              n=$((n + 1))
            else
              echo "::warning::Could not link connection '$res'."
              echo "$OUT" | head -5 | sed 's/^/      /'
            fi
          done < <(python3 "${RUNNER_TEMP:-/tmp}/list_connections.py" "$CONFIG")

          echo "Linked $n of $total connection(s) to $FOLDER_PATH."
          echo "$FOLDER_PATH" > "${RUNNER_TEMP:-/tmp}/link_retry.txt"
          [ "$n" -gt 0 ]
          }

          CONFIG_ARG=""
          if link_connections; then
            CONFIG_ARG="--config-file $CONFIG"
          else
            echo "::warning::Deploying without connection links. If it fails with CNS1072, the connections in $FOLDER_PATH need to exist with the same names as in the solution."
          fi

          # Everything in here is deliberately at column 0: a heredoc terminator has
          # to start the line, and indentation inside a shell function is irrelevant.
          # (Putting the python at column 0 in the YAML instead would end the block
          # scalar and silently truncate this whole script.)
          find_deployment_key() {
          # The program goes to a file first: `python3 - <<EOF` reads the PROGRAM from
          # stdin, which would clobber the piped JSON and leave nothing to parse.
          cat > "${RUNNER_TEMP:-/tmp}/find_deployment_key.py" <<'EOF_KEY'
          import json, sys

          want = sys.argv[1].lower()
          try:
              doc = json.load(sys.stdin)
          except Exception:
              print("")
              raise SystemExit(0)

          # The list response has been reshaped more than once, so walk it rather
          # than assuming where the rows live.
          stack, found = [doc], ""
          while stack:
              node = stack.pop()
              if isinstance(node, dict):
                  low = {k.lower(): v for k, v in node.items()}
                  if "key" in low and str(low.get("name", "")).lower() == want:
                      found = str(low["key"])
                      break
                  stack.extend(node.values())
              elif isinstance(node, list):
                  stack.extend(node)
          print(found)
          EOF_KEY
          uip solution deploy list --limit 200 --output json 2>/dev/null \
            | python3 "${RUNNER_TEMP:-/tmp}/find_deployment_key.py" "$1"
          }
          for i in $(seq 1 $MAX_ATTEMPTS); do
            EXIT_CODE=0
            # --parent-folder-path, NOT --folder-path. CLI 1.202 rejects the latter
            # with "unknown option '--folder-path' (Did you mean --folder-name?)" and
            # the step dies in 0s. --folder-name is the NEW folder this deployment
            # creates; --parent-folder-path is where that folder is created.
            OUTPUT=$(uip solution deploy run \
              --name "$NAME" \
              --package-name "$NAME" \
              --package-version "$VERSION" \
              --folder-name "$NAME" \
              --parent-folder-path "$FOLDER_PATH" \
              $CONFIG_ARG 2>&1) || EXIT_CODE=$?
            echo "$OUTPUT"

            if echo "$OUTPUT" | grep -q "Deployment polling failed"; then
              echo "::warning::Polling failed but the deploy was initiated. Treating as success."
              exit 0
            fi
            if echo "$OUTPUT" | grep -q "Package version for deployment is not ready"; then
              echo "Attempt $i/$MAX_ATTEMPTS: package not yet indexed by Orchestrator. Waiting ${DELAY}s..."
              sleep $DELAY
              continue
            fi
            # A FOLDER collision is not a deployment collision. `deploy run` always
            # creates a new folder, so a leftover folder from a failed attempt gives
            # "Folder already exists" - routing that to the upgrade path would try to
            # upgrade a deployment that may not exist, or one that never installed
            # cleanly (which the server rejects).
            if [ "$EXIT_CODE" -ne 0 ] && echo "$OUTPUT" | grep -qi "folder already exists"; then
              echo "::error::The Orchestrator folder '$FOLDER_PATH/$NAME' already exists, left over from an earlier deployment attempt."
              echo "::error::Remove it first - 'uip solution deploy uninstall <deployment-key>' clears the deployment and its folder - then re-run. 'uip solution deploy list' shows the key."
              exit "$EXIT_CODE"
            fi

            if [ "$EXIT_CODE" -ne 0 ] && echo "$OUTPUT" | grep -q "already exists"; then
              echo "::notice::A deployment already exists - upgrading instead."
              # `deploy upgrade` takes the deployment KEY as a positional argument -
              # not --name/--package-name/--package-version, which it rejects.
              KEY=$(find_deployment_key "$NAME")
              if [ -z "$KEY" ]; then
                echo "::error::A deployment named '$NAME' already exists but its key was not found in 'uip solution deploy list'. Upgrade it from the Orchestrator UI, or re-run once the list shows it."
                uip solution deploy list --limit 200 --output table 2>&1 | head -20
                exit 1
              fi
              # No --version: only the LATEST published version is a valid target
              # today, and passing an explicit one that is not the newest is rejected.
              # The pipeline publishes immediately before this, so newest IS ours.
              echo "Upgrading deployment $KEY (to the newest published version)"
              UPOUT=$(uip solution deploy upgrade "$KEY" 2>&1); UPRC=$?
              echo "$UPOUT"
              if [ "$UPRC" -ne 0 ]; then
                echo "::error::Upgrade was rejected. A deployment can only be upgraded when it installed cleanly - one left in a failed or partially-provisioned state has to be uninstalled and deployed again:"
                echo "::error::  uip solution deploy uninstall $KEY"
              fi
              exit "$UPRC"
            fi
            if [ "$EXIT_CODE" -ne 0 ] && echo "$OUTPUT" | grep -q "LinkedResourceNotFound" \
               && [ -s "${RUNNER_TEMP:-/tmp}/link_retry.txt" ] && [ -z "${RELINKED:-}" ]; then
              echo "::notice::Link by folder key was rejected - relinking by folder name and retrying once."
              RELINKED=1
              while IFS= read -r r; do
                [ -n "$r" ] || continue
                uip solution deploy config link "$CONFIG" "$r" --name "$r" --folder-path "$FOLDER_PATH" >/dev/null 2>&1 \
                  && echo "  relinked '$r' -> folder-path=$FOLDER_PATH"
              done < <(python3 "${RUNNER_TEMP:-/tmp}/list_connections.py" "$CONFIG")
              continue
            fi

            # Last resort: deploy with no link overrides at all. That is the old
            # behaviour - the connections get provisioned and need a one-time
            # authentication in Orchestrator - but a deployed solution awaiting one
            # click beats a red pipeline and nothing in the folder.
            if [ "$EXIT_CODE" -ne 0 ] && echo "$OUTPUT" | grep -q "LinkedResourceNotFound" \
               && [ -n "$CONFIG_ARG" ] && [ -z "${BARE:-}" ]; then
              echo "::warning::Linking failed by both folder key and folder name. Deploying WITHOUT link overrides - the connections will need authenticating once in Orchestrator."
              BARE=1
              CONFIG_ARG=""
              continue
            fi

            if echo "$OUTPUT" | grep -q "LinkedResourceNotFound"; then
              echo "::error::The deploy config linked connections to a folder that Orchestrator does not agree with. What it reported is logged above as 'connections in Orchestrator:'."
              echo "::error::Compare them with the 'linked ... ->' lines above. If the index lists nothing, the connections exist in Integration Service but are not indexed as solution resources - add them with 'uip solution resources add --source remote --kind Connection --name <name> --folder-path <folder>' and re-run."
            fi
            if echo "$OUTPUT" | grep -q "CNS1072"; then
              echo "::error::The deployment provisioned NEW, unauthenticated connections instead of binding to the existing ones in $FOLDER_PATH."
              echo "::error::Each connection in the solution must be linked in the deploy config. Check that a connection with the SAME NAME exists in $FOLDER_PATH and that 'uip solution deploy config link' succeeded above."
            fi
            exit ${EXIT_CODE}
          done
          echo "::error::Package never became ready after $MAX_ATTEMPTS attempts (~$((MAX_ATTEMPTS*DELAY))s)"
          exit 1

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "### 3. Deploy"
            echo ""
            echo "\`${{ needs.resolve.outputs.solution_name }}\` v\`${{ needs.resolve.outputs.version }}\` -> folder \`${{ needs.resolve.outputs.folder_path }}\`"
            echo ""
            echo "Path: $([ "${{ steps.publish.outputs.solution }}" = "true" ] && echo 'solution publish + deploy run' || echo 'package upload (no Solution wrapper)')"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════
  # 4. Verify
  # Reads back what is actually in the tenant, so a green deploy that shipped
  # nothing cannot pass silently.
  # ═══════════════════════════════════════════════════════════════
  verify:
    name: Verify
    needs: [resolve, deploy]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install UiPath CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          command -v uip >/dev/null || npm install -g "@uipath/cli@${CLI_VERSION}"
          # Freeze the CLI at the exact version: without an exact (three-part) pin its
          # daily auto-updater pulls the newest patch in the line on first use, so the
          # deploy could run on a CLI nobody rehearsed with.
          case "$CLI_VERSION" in
            *.*.*) uip config set version "$CLI_VERSION" --output json >/dev/null 2>&1 || true ;;
          esac

      - name: Authenticate
        env:
          UIPATH_CLIENT_ID:     ${{ secrets.UIPATH_STAGING_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_STAGING_CLIENT_SECRET }}
          UIPATH_TENANT:        ${{ vars.UIPATH_STAGING_TENANT }}
          UIPATH_AUTHORITY:     ${{ vars.UIPATH_STAGING_AUTHORITY }}
          UIPATH_ORGANIZATION:  ${{ vars.UIPATH_STAGING_ORGANIZATION }}
        run: |
          set -euo pipefail
          uip login --client-id "$UIPATH_CLIENT_ID" --client-secret "$UIPATH_CLIENT_SECRET" \
            --tenant "$UIPATH_TENANT" --authority "$UIPATH_AUTHORITY" \
            --organization "$UIPATH_ORGANIZATION" \
            --scope "OR.Administration.Read OR.Execution.Read OR.Folders.Read OR.Jobs.Read AutomationSolutions Solutions.Deployments.Read Solutions.Packages.Read"

      - name: Confirm what landed
        env:
          NAME:        ${{ needs.resolve.outputs.solution_name }}
          VERSION:     ${{ needs.resolve.outputs.version }}
          SCOPE:       ${{ needs.resolve.outputs.scope }}
          FOLDER_PATH: ${{ needs.resolve.outputs.folder_path }}
        run: |
          set -uo pipefail
          echo "=== processes in $FOLDER_PATH ==="
          uip or processes list --all-folders --output table 2>&1 | head -40 || \
            echo "::warning::Could not list processes - check the granted scopes."

          # Same reasoning as Publish: a solution was shipped whenever one was packed,
          # regardless of what sdd_scope says.
          if find "$OUTPUT_DIR" -type f \( -name '*.uipx' -o -name '*.zip' \) 2>/dev/null | grep -q .; then
            echo "=== solution deployments ==="
            uip solution deploy list --output table 2>&1 | head -20 || \
              echo "::warning::Could not list solution deployments."
          fi

          {
            echo "### 4. Verify"
            echo ""
            echo "Deployed \`$NAME\` v\`$VERSION\`. Post-deploy resource setup (assets,"
            echo "credentials, queues, Integration Service connections) is not done here -"
            echo "the SDD's *Credentials & Assets* section lists what must exist, and the"
            echo "\`uipath-platform\` skill creates them."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          fetch-depth: 1

      - name: Observe - Production live
        # A dashboard write must never fail the pipeline: observe.sh uses `set -e`, so
        # a rate limit or a transient 5xx would otherwise take a good stage down with it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          bash .github/scripts/observe.sh stage Production status=done

  # ═══════════════════════════════════════════════════════════════
  # Fault
  # Without this a crashed run leaves the stage on `in-progress` and the card
  # spins for ever. Runs only when a job above actually failed - a skipped job
  # does not count as a failure.
  # ═══════════════════════════════════════════════════════════════
  faulted:
    name: Record fault
    needs: [guard, resolve, build, deploy, verify]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          fetch-depth: 1

      - name: Observe - Production faulted
        # A dashboard write must never fail the pipeline: observe.sh uses `set -e`, so
        # a rate limit or a transient 5xx would otherwise take a good stage down with it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          bash .github/scripts/observe.sh stage Production status=faulted \
            task="The production run failed" \
            run=${{ github.run_id }} \
            runUrl=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
