name: uipath-review

# Stage 5 of the ADLC chain, as ONE job:
#
#   resolve PR -> machine gates -> agent posts the review -> merge -> start Docs
#
# This one is NOT a branch stage. Every other stage cuts a branch, writes a file and
# opens a PR; review has nothing to write, so it hangs off the PR that
# uipath-develop already opened. That is also why it needs no Jira story and no
# api-create-branch call - it is an event on the Development PR, not a stage with a
# branch of its own.
#
# It reviews the implementation against the SDD - the design was approved, so the
# question is "does the code do what the SDD says", not "is this a reasonable idea".
#
# It applies ONLY to implementation PRs - head branch `dev-*` or `development-*`.
# Every other PR into develop (analysis-*, architecture-*, docs-*) is a document PR
# and is skipped before any job starts.
#
# THE MACHINE CHECKS ARE THE GATE, NOT THE AGENT. `Run checks` re-runs the three
# deterministic proofs the Test stage gated on - `uip api-workflow validate`,
# `validate-build.sh` and `uip solution pack` - against the PR HEAD, and those are
# the only things that stop this stage. They correspond exactly to the two
# conditions worth stopping for: the automation is not valid, or the deploy would
# fail. Both are machine-decidable, and both were already decided once in Test.
#
# The agent therefore ALWAYS approves. It reads the real diff and posts a real
# review with real findings, so the bot appears in the Reviewers sidebar and there
# is something to show - but its verdict is commentary, and commentary does not
# hold a release. An agent having an off day used to leave the PR open and stall
# the chain one stage from production on a build that was demonstrably fine.
#
# If you want this stage to be able to reject a build again, add the check to
# `Run checks` as a machine test. Do not give the verdict back its teeth.
#
# The human gates for the release are the PDD PR and the develop -> main PR, not
# this one.
#
# Jira is NOT touched from here - Flow owns every Jira transition in this chain.

# A pull_request trigger can only filter the BASE branch, never the head - GitHub
# has no head-branches filter. So the head is filtered twice, at two different
# levels, because neither alone does the whole job:
#
#   `paths: code/**` (here)   stops the RUN from being created at all. A document PR
#                             - analysis-* writing docs/pdd-*.md, architecture-*
#                             writing docs/sdd-*.md - touches no code, so GitHub
#                             never starts this workflow and nothing appears in the
#                             PR's checks or the Actions tab. `branches` and `paths`
#                             are ANDed, so this means "into develop AND touches
#                             code". An implementation PR always touches code/** by
#                             definition, so it always fires.
#
#   head-ref `if:` (below)    still needed: paths describe what a PR CHANGED, not
#                             where it came from. Someone pushing a stray code file
#                             on a docs branch would create a run that this catches.
#
# Only the first is cosmetic; a skipped job already costs nothing. The point of the
# paths filter is that a document PR no longer shows a review entry it will never
# act on. workflow_dispatch is unaffected by paths, so a manual re-run still works
# on any PR.
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths:
      - 'code/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCS_DIR: docs
  CODE_DIR: code
  # Implementation-branch prefixes. `dev-` is the current convention; `development-`
  # is the one the case plan used. Both are accepted so the chain works either way
  # during the Case -> Flow migration.
  # KEEP IN SYNC with the validate job's `if:` below - a job-level `if` cannot read
  # the env context, so the prefixes are unavoidably written in both places.
  REVIEW_HEAD_PREFIXES: 'dev- development-'
  ASSIGNEE: irina-capatina-uipath
  AGENT_MODEL: claude-sonnet-4-6
  # Consumed by claude-code-base-action, which sets the AGENT's Node from this
  # variable and falls back to 18.x without it (`node-version: ${{ env.NODE_VERSION ||
  # '18.x' }}` in its action.yml). @uipath/cli needs Node 20 (`util.styleText`). This
  # line was once deleted as "stale config with no consumers"; the developer agent
  # then got Node 18, could not start `uip`, hand-built a solution and patched the CLI
  # to make it run, and the solution feed rejected the package. Do not remove it.
  NODE_VERSION: '20'
  # Exact pin, so the CLI cannot change between rehearsal and stage. 1.202.1 is the
  # version every successful run used. NOTE: the CLI needs Node 20 - see NODE_VERSION.
  # A run once failed with `'node:util' does not provide an export named 'styleText'`;
  # that was the agent's Node, not the CLI version.
  CLI_VERSION: '1.202.1'

permissions:
  # write, not read: observe.sh PUTs observability.json through the contents
  # API, and the workflow permissions block caps what GITHUB_TOKEN may do.
  # Under `read` every status write 403s, including the verdict that
  # the merge job reports.
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:

  # ═══════════════════════════════════════════════════════════════
  # 1. Run checks
  # Deterministic gate before the agent spends a token. Also the job that decides
  # whether this PR is even ours to review - the PDD and SDD PRs also target
  # develop, and they carry no code.
  # ═══════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════
  # ONE job. This used to be four - Run checks, Review PR, Merge and start Docs,
  # plus the fault recorder - and three of them existed only to carry a PR number
  # and two SHAs across runner boundaries, each costing a spin-up, a checkout and a
  # gap. The stage's budget is about a minute, and the base action alone spends
  # fifteen seconds of it installing the Claude CLI, so there is no room for
  # boundaries that move nothing.
  # ═══════════════════════════════════════════════════════════════
  review:
    name: Review PR
    if: >-
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR refs
        id: pr
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO:      ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid  --jq .baseRefOid)
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid  --jq .headRefOid)
          HEAD_REF=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq .headRefName)

          # Second line of defence, for the workflow_dispatch path that the job-level
          # `if` deliberately lets through. Only an implementation branch carries code;
          # the analysis-*, architecture-* and docs-* PRs into develop are document PRs
          # reviewed by a human, so this workflow stays out of their way.
          REVIEWABLE=false
          for prefix in $REVIEW_HEAD_PREFIXES; do
            case "$HEAD_REF" in
              "$prefix"*) REVIEWABLE=true; break ;;
            esac
          done

          {
            echo "pr_number=$PR_NUMBER"
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
            echo "head_ref=$HEAD_REF"
            echo "reviewable=$REVIEWABLE"
          } >> "$GITHUB_OUTPUT"

          echo "PR #$PR_NUMBER  head=$HEAD_REF  reviewable=$REVIEWABLE"
          if [ "$REVIEWABLE" != "true" ]; then
            {
              echo "### Review skipped"
              echo ""
              echo "PR #$PR_NUMBER comes from \`$HEAD_REF\`, which is a document branch."
              echo "\`uipath-review\` only reviews implementation PRs - head must start with one of: \`$REVIEW_HEAD_PREFIXES\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.pr.outputs.reviewable == 'true'
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Resolve design inputs on the PR head
        id: inputs
        if: steps.pr.outputs.reviewable == 'true'
        run: |
          set -euo pipefail
          # 2>/dev/null || true: a missing docs/ would make find fail, and under
          # pipefail that kills the step before the clear error below can print.
          ARCH_FILE=$(find "$DOCS_DIR" -maxdepth 1 -type f -name 'architecture-*.json' 2>/dev/null | sort | tail -1 || true)
          if [ -z "${ARCH_FILE:-}" ]; then
            echo "::error::No $DOCS_DIR/architecture-*.json on this PR - cannot review against a design."
            exit 1
          fi
          python3 -c "import json,sys;json.load(open(sys.argv[1]))" "$ARCH_FILE" \
            || { echo "::error::$ARCH_FILE is not valid JSON."; exit 1; }
          PRODUCT=$(python3 -c "import json;print(json.load(open('$ARCH_FILE'))['primary_product'])")
          SDD_FILES=$(python3 -c "import json;print(' '.join(f['path'] for f in json.load(open('$ARCH_FILE'))['sdd_files']))")
          {
            echo "arch_file=$ARCH_FILE"
            echo "sdd_files=$SDD_FILES"
            echo "product=$PRODUCT"
          } >> "$GITHUB_OUTPUT"
          echo "Design: $ARCH_FILE ($PRODUCT)"

      - name: Check required files exist
        if: steps.pr.outputs.reviewable == 'true'
        run: |
          set -euo pipefail
          FAILED=0
          for f in "$CODE_DIR/build-notes.md" ${{ steps.inputs.outputs.sdd_files }}; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file missing: $f"; FAILED=1
            else
              echo "  ok  - $f"
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Validate project files parse
        if: steps.pr.outputs.reviewable == 'true'
        run: |
          set -euo pipefail
          FOUND=0; FAILED=0
          while IFS= read -r j; do
            FOUND=1
            if python3 -c "import json,sys;json.load(open(sys.argv[1]))" "$j" 2>/dev/null; then
              echo "  ok  - $j"
            else
              echo "::error::$j is not valid JSON"; FAILED=1
            fi
          done < <(find "$CODE_DIR" -maxdepth 4 -type f \
                     \( -name 'Workflow.json' -o -name 'project.json' -o -name 'uipath.json' \
                     -o -name 'agent.json' -o -name 'entry-points.json' -o -name 'caseplan.json' \) | sort)

          # XAML is XML, not JSON - parse it as such.
          while IFS= read -r x; do
            FOUND=1
            if python3 -c "import xml.etree.ElementTree as E,sys;E.parse(sys.argv[1])" "$x" 2>/dev/null; then
              echo "  ok  - $x"
            else
              echo "::error::$x is not well-formed XML"; FAILED=1
            fi
          done < <(find "$CODE_DIR" -maxdepth 4 -type f -name '*.xaml' | sort)

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No recognisable UiPath project file under $CODE_DIR/ - nothing was built."
            exit 1
          fi
          [ "$FAILED" -eq 0 ] || exit 1

      # ── the only thing that may fail this stage ───────────────────────────
      # The review AGENT no longer blocks anything (see the review job below), so
      # this is where "the automation is not valid" and "the deploy would fail"
      # are actually decided - by the same three deterministic checks the Test
      # stage gated on, re-run against the PR HEAD. A judgement call is not
      # allowed to stop the chain two stages from production; a machine check is.
      #
      # Not redundant with Test: Test ran on the development branch, this runs on
      # the commit that is about to merge. It costs about twelve seconds.
      - name: Prove the build is valid and deployable
        id: gates
        if: steps.pr.outputs.reviewable == 'true'
        env:
          PRODUCT: ${{ steps.inputs.outputs.product }}
        run: |
          set -uo pipefail
          RC=0; V_OK=skipped; B_OK=skipped; P_OK=skipped

          npm i -g "@uipath/cli@${CLI_VERSION}" >/dev/null 2>&1 \
            || { echo "::warning::@uipath/cli install failed - CLI gates skipped"; }
          case "$CLI_VERSION" in
            *.*.*) uip config set version "$CLI_VERSION" --output json >/dev/null 2>&1 || true ;;
          esac

          # 1. the workflow is structurally valid
          if command -v uip >/dev/null 2>&1 && [ "$PRODUCT" = "api-workflows" ]; then
            while IFS= read -r proj; do
              [ -n "$proj" ] || continue
              echo "=== uip api-workflow build/validate ($proj) ==="
              MAIN=$(python3 -c "import json;print(json.load(open('$proj/project.uiproj')).get('MainFile') or 'Workflow.json')")
              if ( cd "$proj" && uip api-workflow build . && uip api-workflow validate "$MAIN" ); then V_OK=passed
              else echo "::error::$proj does not validate - the automation would not run."; RC=1; V_OK=FAILED; fi
            done < <(find "$CODE_DIR" -maxdepth 3 -type f -name 'project.uiproj' -exec dirname {} \; | sort)
          fi

          # 2. it can actually run - the checks `uip api-workflow validate` cannot make
          if [ -f .github/scripts/validate-build.sh ]; then
            echo "=== validate-build.sh ==="
            if bash .github/scripts/validate-build.sh "$CODE_DIR" "$DOCS_DIR/architectural-considerations.md"; then B_OK=passed
            else echo "::error::the built workflow cannot run as built."; RC=1; B_OK=FAILED; fi
          fi

          # 3. deploy readiness - packing is the only offline proof of it
          if command -v uip >/dev/null 2>&1; then
            while IFS= read -r sol; do
              [ -n "$sol" ] || continue
              echo "=== uip solution pack ($sol) ==="
              if ( cd "$sol" && uip solution pack . "$RUNNER_TEMP/reviewpack" --name "$(basename "$sol")" --version 0.0.1 --output json ); then P_OK=passed
              else echo "::error::solution pack failed in $sol - the deploy stage would fail."; RC=1; P_OK=FAILED; fi
            done < <(find "$CODE_DIR" -maxdepth 3 -type f -name '*.uipx' -exec dirname {} \; | sort -u)
          fi

          if [ "$RC" -ne 0 ]; then
            echo "::error::Review stage stopped: the implementation is not valid or would not deploy. This is the only condition that stops this stage - the review agent itself never blocks."
            exit 1
          fi
          { echo "validate=$V_OK"; echo "build=$B_OK"; echo "pack=$P_OK"; } >> "$GITHUB_OUTPUT"
          echo "Valid and deployable."

      - name: Checks summary
        if: steps.pr.outputs.reviewable == 'true'
        run: |
          {
            echo "### 1. Checks passed"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| PR | #${{ steps.pr.outputs.pr_number }} |"
            echo "| Head | \`${{ steps.pr.outputs.head_ref }}\` |"
            echo "| Design | \`${{ steps.inputs.outputs.arch_file }}\` |"
            echo "| Product | \`${{ steps.inputs.outputs.product }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════
  # 2. Review PR
      - name: Observe - Testing in review
        if: steps.pr.outputs.reviewable == 'true'
        # A dashboard write must never fail the pipeline: observe.sh uses `set -e`, so
        # a rate limit or a transient 5xx would otherwise take a good stage down with it.
        continue-on-error: true
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          REPO:      ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          bash .github/scripts/observe.sh stage Testing status=in-review decidedBy=agent \
            pr="$PR_NUMBER" \
            task="The review agent is reviewing the implementation"

      # The skills install used to live here. It cost about fifteen seconds and
      # bought two SKILL.md reads. The review checklist is in the repo; the
      # product idiom is in the diff and the SDD. Not worth a job's worth of setup.
      #
      # Everything the agent needs is assembled here instead, into one file it
      # reads once. The previous run spent 61 turns and 27 tool calls, a third of
      # them re-running a validation the Test stage had already gated on, hunting
      # for the `uip` binary on $PATH, and re-reading its own posted review.
      - name: Assemble the review bundle
        if: steps.pr.outputs.reviewable == 'true'
        env:
          BASE_SHA:  ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA:  ${{ steps.pr.outputs.head_sha }}
          ARCH_FILE: ${{ steps.inputs.outputs.arch_file }}
          SDD_FILES: ${{ steps.inputs.outputs.sdd_files }}
          G_VALIDATE: ${{ steps.gates.outputs.validate }}
          G_BUILD:    ${{ steps.gates.outputs.build }}
          G_PACK:     ${{ steps.gates.outputs.pack }}
        run: |
          set -uo pipefail
          # The build is a copy of the reference implementation adjusted to the SDD, and
          # the three machine gates above have already decided it is valid and would
          # deploy. There is nothing left to JUDGE, so the agent does not get a diff to
          # judge - the diff of a fresh 22 KB Workflow.json is the whole file, and the
          # last run read that seven times. It gets facts, computed here, and narrates
          # them. Everything below is deterministic; the agent's only job is prose.
          B=/tmp/review-bundle.md
          WF=$(find "$CODE_DIR" -maxdepth 4 -name Workflow.json -not -path '*/dist/*' | head -1)
          PDD=$(find "$DOCS_DIR" -maxdepth 1 -iname 'pdd-*.md' | head -1)
          SOL=$(python3 -c "import json;d=json.load(open('$ARCH_FILE'));print(d.get('solution_name','?'))" 2>/dev/null || echo "?")
          PRJ=$(python3 -c "import json;d=json.load(open('$ARCH_FILE'));print(d['projects'][0]['name'])" 2>/dev/null || echo "?")
          ACTS=$( { grep -c '"activityType"' "$WF" 2>/dev/null || true; } | tail -1); ACTS=${ACTS:-0}
          {
            echo "# Review fact sheet - PR head ${HEAD_SHA:0:7}"
            echo
            echo "## Machine gates (already decided - these are the review)"
            echo "| Gate | Result |"; echo "| --- | --- |"
            echo "| uip api-workflow build + validate | $G_VALIDATE |"
            echo "| validate-build.sh (runnability: URLs, connections, Block Kit, names) | $G_BUILD |"
            echo "| uip solution pack (deploy readiness) | $G_PACK |"
            echo
            echo "## What was built"
            echo "| | |"; echo "| --- | --- |"
            echo "| Solution | \`$SOL\` |"; echo "| API Workflow project | \`$PRJ\` |"
            echo "| Activities in Workflow.json | $ACTS |"
            echo "| Files changed | $(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null | wc -l | tr -d ' ') |"
            echo
            # Rule ids are not embedded in Workflow.json - the workflow implements the
            # SDD, and the SDD carries the ids - so coverage is measured against the
            # design and the build notes, never against the JSON.
            echo "## Business-rule coverage (every PDD rule carried into the design?)"
            echo "| Rule | In SDD | In build notes |"; echo "| --- | --- | --- |"
            if [ -n "$PDD" ]; then
              awk '/^## [0-9]+\. Business Rules$/{f=1;next} f&&/^## /{exit} f&&/^\|/{n=split($0,c,"|");id=c[2];gsub(/^[ \t]+|[ \t]+$/,"",id);if(id~/^BR-[0-9]+$/)print id}' "$PDD" \
              | while read -r id; do
                  sd=0; for f in $SDD_FILES; do c=$( { grep -c "$id" "$f" 2>/dev/null || true; } | tail -1); sd=$((sd + ${c:-0})); done
                  bn=$( { grep -c "$id" "$CODE_DIR/build-notes.md" 2>/dev/null || true; } | tail -1); bn=${bn:-0}
                  echo "| $id | $([ "$sd" -gt 0 ] && echo yes || echo no) | $([ "$bn" -gt 0 ] && echo yes || echo no) |"
                done
            else
              echo "| (no PDD found) | - | - |"
            fi
            echo
            echo "## build-notes.md (first 60 lines)"
            head -60 "$CODE_DIR/build-notes.md" 2>/dev/null || echo "(none)"
          } > "$B"
          echo "bundle: $(wc -c < "$B") bytes"; cat "$B"

      - name: Run uipath-review agent
        if: steps.pr.outputs.reviewable == 'true'
        uses: anthropics/claude-code-base-action@beta
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          REPO:      ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          BASE_SHA:  ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA:  ${{ steps.pr.outputs.head_sha }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ env.AGENT_MODEL }}
          # Hard caps, both of them. This step is commentary - nothing downstream
          # waits on its opinion - and its whole job is one Read and one gh call.
          # max_turns bounds the damage if the agent starts exploring anyway: the
          # run that lost its GH_TOKEN took 77 turns; this cannot take more than 5.
          timeout_minutes: '2'
          max_turns: '5'
          allowed_tools: "Read,Bash"
          prompt: |
            You are uipath-review. Post the implementation review on PR $PR_NUMBER in
            $REPO. You have TWO actions to take, in this order, and then you stop.

            **Action 1 - Read `/tmp/review-bundle.md`, once.** It is a short fact sheet:
            the three machine gates and their results, what was built, a business-rule
            coverage table, and the build notes. Every fact you need is in it. Do not
            read anything else, do not run git, do not run uip - the gates already ran.

            **Action 2 - write the body and post it, in one Bash call:**

                cat > /tmp/review-body.md <<'EOF_BODY'
                ## Implementation Review

                **Summary:** <one sentence: what this PR delivers, from the fact sheet>

                **Machine gates:** validate <result> · runnability <result> · pack <result>

                **Business-rule coverage:** <n> of <m> PDD rules carried into the design
                <one line per rule whose SDD column says "no", if any - otherwise omit this line>

                **Notes:** <one or two sentences from build-notes.md worth a reviewer's eye, or "No deviations declared.">

                ---

                > [!TIP]
                > **Recommendation: MERGE** — validated, runnable and deployable by machine check; the review is informational.
                EOF_BODY
                gh pr review "$PR_NUMBER" --repo "$REPO" --approve --body-file /tmp/review-body.md

            The single-quoted `'EOF_BODY'` is required so bash leaves the backticks
            alone. Always `--approve`: this review cannot block, because everything
            that could justify blocking was decided by the gates before you started.
            If `--approve` is refused (token authored the PR), run the same command
            with `--comment` and say so. If that fails too, report the error and stop.

            `GH_TOKEN` is set. If `gh` fails, do NOT look for another credential, do
            NOT run `gh auth login`, do NOT read the environment or runner temp files.
            Report and stop. Do not read the review back afterwards - the next step does.
            Do not use the TodoWrite tool.

      - name: Read back the verdict
        if: steps.pr.outputs.reviewable == 'true'
        id: verdict
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          REPO:      ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -uo pipefail
          STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json reviews \
                    --jq '[.reviews[] | select(.state=="APPROVED" or .state=="CHANGES_REQUESTED")] | last | .state' \
                    2>/dev/null || echo "")
          [ -n "$STATE" ] && [ "$STATE" != "null" ] || STATE="NONE"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          {
            echo "### 2. Review posted"
            echo ""
            echo "Verdict on #$PR_NUMBER: \`$STATE\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # The verdict is REPORTED, not obeyed. Whether this implementation is
          # safe to merge was settled by the machine gates in the job before, and
          # the agent is instructed to always approve. A missing or unexpected
          # verdict means the comment did not post - which is a cosmetic failure,
          # not a reason to halt a release that has already been proven valid and
          # deployable. That distinction is the whole point of this stage's design.
          case "$STATE" in
            APPROVED)          echo "Review posted and approved." ;;
            CHANGES_REQUESTED) echo "::warning::The agent requested changes despite being told always to approve. The gates passed, so the merge proceeds; read the review body before the demo." ;;
            *) echo "::warning::No review comment was posted. The gates passed, so the merge proceeds without one." ;;
          esac

  # ═══════════════════════════════════════════════════════════════
  # 3. Merge or escalate
  # The agent's verdict is the gate. APPROVED merges into develop and the chain
  # continues into Docs; anything else leaves the PR open for a human, which stalls
  # the case on purpose - a rejected implementation should not reach production.
      # GITHUB_TOKEN, never the dev PAT: this job posts the agent's review on a PR
      # the PAT now authors, and GitHub rejects a review submitted by the PR's own
      # author. Reviewing as the bot is also what puts it in the Reviewers sidebar.
      - name: Merge, then start Docs
        if: steps.pr.outputs.reviewable == 'true'
        id: merge
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          REPO:      ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          VERDICT:   ${{ steps.verdict.outputs.state }}
        run: |
          set -euo pipefail

          # This merges whatever reached it, and that is correct rather than lax.
          # Reaching this job means the gates in `Run checks` passed: the workflow
          # validates, `validate-build.sh` is clean and the solution packs. Those
          # are the two conditions that justify stopping - "the automation is not
          # valid" and "the deploy would fail" - and they are machine-decided.
          # The agent's verdict is commentary printed on the PR for a human, and
          # commentary does not hold a release. Before this, an agent having an
          # off day left the PR open and stalled the chain one stage from
          # production, on a build that was demonstrably fine.
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-assignee "$ASSIGNEE" || true
          if gh pr merge "$PR_NUMBER" --repo "$REPO" --merge; then
            RESULT="merged into develop"
          elif gh pr merge "$PR_NUMBER" --repo "$REPO" --merge --auto; then
            RESULT="auto-merge queued"
          else
            echo "::error::PR #$PR_NUMBER passed every gate but the merge failed. Check branch protection and token permissions."
            exit 1
          fi
          echo "$RESULT (review verdict: ${VERDICT:-none})"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          {
            echo "### 3. Merged"
            echo ""
            echo "#$PR_NUMBER $RESULT. The chain continues into Docs."
            echo ""
            echo "Gates: \`api-workflow validate\`, \`validate-build.sh\` and \`solution pack\` all passed on the PR head. Review verdict \`${VERDICT:-none}\` is recorded on the PR for a human to read."
          } >> "$GITHUB_STEP_SUMMARY"

      # This job otherwise makes only `gh` API calls and needs no working tree - but
      # observe.sh is a FILE, and a job that never checks out has an empty workspace.
      # Sparse: only the scripts, from develop, so it costs a second.
      - name: Observe - Testing decided
        if: steps.pr.outputs.reviewable == 'true'
        # A dashboard write must never fail the pipeline: observe.sh uses `set -e`, so
        # a rate limit or a transient 5xx would otherwise take a good stage down with it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          # The gate is on Testing, not Development: Development went done when its
          # tests passed, and Testing is the rightmost bubble before Docs, so nothing
          # to its right can be green while this decision is still open.
          if [ "${{ steps.merge.outputs.merged }}" = "true" ]; then
            bash .github/scripts/observe.sh stage Testing status=done
          else
            bash .github/scripts/observe.sh stage Testing status=in-review decidedBy=human \
              task="The review agent requested changes"
          fi

      # `Start Docs` used to be its own job gated on `merged == 'true'`. It is two
      # `gh api` calls and a dashboard write - a whole runner and a second checkout
      # to do thirteen seconds of work. Same gate, now a step-level `if`.
      - name: Create docs-<key> from develop
        if: steps.merge.outputs.merged == 'true'
        env:
          # A ref created with GITHUB_TOKEN does NOT trigger workflows, so the PAT is
          # what actually starts uipath-dsd.
          GH_TOKEN:  ${{ secrets.DEV_PR_AUTHOR_PAT || secrets.GITHUB_TOKEN }}
          USING_PAT: ${{ secrets.DEV_PR_AUTHOR_PAT != '' }}
          REPO:      ${{ github.repository }}
          HEAD_REF:  ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail

          # dev-jactiv-611 / development-jactiv-611 -> jactiv-611
          KEY="${HEAD_REF#*-}"
          if [ -z "$KEY" ] || [ "$KEY" = "$HEAD_REF" ]; then
            echo "::error::Branch '$HEAD_REF' has no key after its prefix."
            exit 1
          fi
          NEXT="docs-$KEY"

          if [ "$USING_PAT" != "true" ]; then
            echo "::warning::DEV_PR_AUTHOR_PAT is not set - $NEXT will be created with GITHUB_TOKEN, which does not trigger workflows. uipath-dsd will not start on its own."
          fi

          if gh api "repos/$REPO/git/ref/heads/$NEXT" >/dev/null 2>&1; then
            echo "::notice::$NEXT already exists - nothing to do."
            exit 0
          fi

          # develop after the merge, so the delivered code is on it - the Docs stage
          # fails outright if code/ is empty, because it documents what was built.
          SHA=$(gh api "repos/$REPO/git/ref/heads/develop" --jq '.object.sha')
          [ -n "${SHA:-}" ] || { echo "::error::Could not read the head of develop."; exit 1; }

          gh api -X POST "repos/$REPO/git/refs" \
            -f ref="refs/heads/$NEXT" -f sha="$SHA" >/dev/null

          echo "Created $NEXT at ${SHA:0:7}."
          {
            echo "### 4. Docs started"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| From | \`$HEAD_REF\` |"
            echo "| Created | \`$NEXT\` |"
            echo "| At | \`${SHA:0:7}\` on \`develop\` |"
            if [ "$USING_PAT" != "true" ]; then
              echo ""
              echo "> [!WARNING]"
              echo "> Created with \`GITHUB_TOKEN\`, so \`uipath-dsd\` will **not** start by itself."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Observe - Documentation begins
        if: steps.merge.outputs.merged == 'true'
        # A dashboard write must never fail the pipeline: observe.sh uses `set -e`, so
        # a rate limit or a transient 5xx would otherwise take a good stage down with it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          bash .github/scripts/observe.sh stage Documentation status=in-progress \
            task="Writing the as-built DSD"

  # ═══════════════════════════════════════════════════════════════
  # Fault
  # Without this a crashed run leaves the stage on `in-progress` and the card
  # spins for ever. Runs only when a job above actually failed - a skipped job
  # does not count as a failure.

  # ═══════════════════════════════════════════════════════════════
  # 4. Start Docs
  # This workflow merges the implementation PR itself, and a merge performed with
  # GITHUB_TOKEN raises no event another workflow could act on - so the hand-over
  # to the Docs stage happens here, in the same run.
  #
  # The analysis key is carried through unchanged:
  #   dev-jactiv-611 -> docs-jactiv-611
  #
  # Guarded on the merge having HAPPENED, not merely on the job having run: a
  # request-changes verdict escalates to a human and leaves the PR open, and Docs
  # must not document code that has not landed.
  # ═══════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════
  faulted:
    name: Record fault
    needs: review
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          sparse-checkout: .github/scripts
          fetch-depth: 1

      - name: Observe - Testing faulted
        # A dashboard write must never fail the pipeline: observe.sh uses `set -e`, so
        # a rate limit or a transient 5xx would otherwise take a good stage down with it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          # Development is already done by the time this workflow runs - the code was
          # written and its tests passed. A failure here is a failure of the review,
          # which is the gate that sits on Testing.
          bash .github/scripts/observe.sh stage Testing status=faulted \
            task="The review run failed" \
            run=${{ github.run_id }} \
            runUrl=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
