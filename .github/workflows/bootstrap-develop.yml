# ═══════════════════════════════════════════════════════════════════════════
# Bootstrap: relate develop to main
#
# The epic repo is created with POST /repos/{owner}/{template}/generate and
# include_all_branches=true. That API does NOT copy the template's history: it
# writes ONE PARENTLESS ROOT COMMIT PER BRANCH. main gets "Initial commit",
# develop gets "Initialize develop" three seconds later with a byte-identical
# tree, and the two share no ancestor. Every story branch is then cut from
# develop, so the release PR at the end of the lifecycle dies with:
#
#     GraphQL: The develop branch has no history in common with main
#
# Merging main into develop in the TEMPLATE cannot fix this - the template's
# history is discarded at generation time, so the break is re-created for every
# new repo. This workflow repairs it the moment develop appears.
#
# It is safe to leave running forever:
#   - every normal push to develop (each story PR merge) hits the merge-base
#     check and exits in a couple of seconds having done nothing;
#   - it refuses to act if develop carries more than its single root commit, so
#     it can never discard work;
#   - GITHUB_TOKEN pushes do not trigger workflows, so there is no loop.
#
# Not gated on `github.event.created`: that flag is not confirmed to be set for
# template-generated branches, and a silently-skipped fix is worse than a
# two-second no-op. The guards below make the broad trigger harmless.
# ═══════════════════════════════════════════════════════════════════════════
name: bootstrap-develop

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-develop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relate:
    name: Relate develop to main
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 - merge-base needs the whole graph, not a shallow tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point develop at main when they are unrelated
        run: |
          set -uo pipefail

          git fetch -q origin main develop 2>/dev/null || {
            echo "::warning::could not fetch both branches - main may not exist yet."
            exit 0
          }

          if git merge-base origin/main origin/develop >/dev/null 2>&1; then
            echo "develop already shares history with main - nothing to do."
            exit 0
          fi

          # No common ancestor. Only safe to repoint while develop is still the
          # bare root commit the generator made; anything more means real work.
          N=$(git rev-list --count origin/develop)
          if [ "$N" -gt 1 ]; then
            echo "::error::develop has ${N} commits and no common ancestor with main."
            echo "::error::Refusing to force-push: that would discard those commits."
            echo "::error::Repair by hand with: git merge origin/main --allow-unrelated-histories"
            exit 1
          fi

          MAIN_SHA=$(git rev-parse --short origin/main)
          echo "develop is a single orphan commit - repointing it at main (${MAIN_SHA})."
          git push origin origin/main:refs/heads/develop --force

          {
            echo "### Bootstrap: develop related to main"
            echo ""
            echo "\`develop\` had no common ancestor with \`main\` - the template"
            echo "generator gives every branch its own root commit."
            echo ""
            echo "Repointed \`develop\` at \`main\` (\`${MAIN_SHA}\`), so the release"
            echo "PR at the end of the lifecycle can be opened."
          } >> "$GITHUB_STEP_SUMMARY"
